<title>Sorare aide · Plateau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Plateau : barre latérale « sélection de niveau » (PC) ou barre d'onglets en bas (iPhone) ;
   accueil = scène 3D des paliers ; contenu en 1, 2 ou 3 colonnes selon la largeur disponible. */
:root {
  /* Neutres (légèrement bleutés, ardoise) */
  --fond: #eaeef2;
  --surface: #ffffff;
  --surface-2: #e1e7ed;
  --trait: #c9d2db;
  --trait-fort: #8593a1;
  --encre: #111b25;
  --doux: #52606d;
  --sur-plein: #ffffff;
  /* Sports : indicateurs seulement, jamais sur un bouton ni un état */
  --foot: #0a7d72;
  --foot-doux: #cfe9e5;
  --nba: #c4336a;
  --nba-doux: #f5d8e3;
  /* États */
  --ok: #1b7438;
  --ok-doux: #d9eedf;
  --attention: #8f4a00;
  --attention-doux: #fbe8d0;
  --stop: #b0251c;
  --stop-doux: #f7dad7;
  /* Étoiles : or distinct de l'orange d'alerte */
  --or: #a87a00;
  --or-plein: #f2c744;
  /* Données */
  --serie-a: #2c4865;
  --serie-b: #a9bed4;
  --bande: #dfe7f0;
  --cat-1: #2c4865; --cat-2: #0a7d72; --cat-3: #b56b00; --cat-4: #7a4bb0; --cat-5: #c4336a;
  /* Scène 3D */
  --ciel-haut: #d6e0ea;
  --ciel-bas: #eef2f5;
  --plateau: #d2dae3;
  --roche: #98a6b5;
  --pierre: #f9fbfc;
  --marqueur: #111b25;
  --voile: rgba(17, 27, 37, .42);
  --ombre: 0 18px 40px -18px rgba(17, 27, 37, .45);

  /* Typographie : 6 tailles de texte + 1 taille héros, 3 graisses */
  --f-display: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-texte: "Figtree", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --t-12: .75rem; --t-13: .8125rem; --t-15: .9375rem; --t-18: 1.125rem; --t-24: 1.5rem; --t-32: 2rem;
  --t-heros: clamp(2.75rem, 5.2vw, 4.25rem);
  /* Rayons : 3 seulement ; espacements sur une grille de 4 */
  --r-s: 6px; --r-m: 12px; --r-pill: 999px;
  --e-1: 4px; --e-2: 8px; --e-3: 12px; --e-4: 16px; --e-6: 24px; --e-8: 32px;
  --gouttiere-g: max(16px, env(safe-area-inset-left, 0px));
  --gouttiere-d: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0c1217; --surface: #141c24; --surface-2: #1c2630; --trait: #2a3642; --trait-fort: #5d6b79;
    --encre: #e7edf2; --doux: #97a5b2; --sur-plein: #0c1217;
    --foot: #3cc6b4; --foot-doux: #12352f; --nba: #ff74a3; --nba-doux: #3a1726;
    --ok: #55c97c; --ok-doux: #143021; --attention: #f2a54e; --attention-doux: #392510; --stop: #ff8076; --stop-doux: #3b1916;
    --or: #f2c744; --or-plein: #f2c744;
    --serie-a: #a9c8e8; --serie-b: #3b5672; --bande: #1f2b37;
    --cat-1: #a9c8e8; --cat-2: #3cc6b4; --cat-3: #f2a54e; --cat-4: #b99af0; --cat-5: #ff74a3;
    --ciel-haut: #0f1922; --ciel-bas: #0c1217; --plateau: #263240; --roche: #161f28; --pierre: #45566a; --marqueur: #f3f6f9;
    --voile: rgba(0, 0, 0, .55); --ombre: 0 18px 40px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #0c1217; --surface: #141c24; --surface-2: #1c2630; --trait: #2a3642; --trait-fort: #5d6b79;
  --encre: #e7edf2; --doux: #97a5b2; --sur-plein: #0c1217;
  --foot: #3cc6b4; --foot-doux: #12352f; --nba: #ff74a3; --nba-doux: #3a1726;
  --ok: #55c97c; --ok-doux: #143021; --attention: #f2a54e; --attention-doux: #392510; --stop: #ff8076; --stop-doux: #3b1916;
  --or: #f2c744; --or-plein: #f2c744;
  --serie-a: #a9c8e8; --serie-b: #3b5672; --bande: #1f2b37;
  --cat-1: #a9c8e8; --cat-2: #3cc6b4; --cat-3: #f2a54e; --cat-4: #b99af0; --cat-5: #ff74a3;
  --ciel-haut: #0f1922; --ciel-bas: #0c1217; --plateau: #263240; --roche: #161f28; --pierre: #45566a; --marqueur: #f3f6f9;
  --voile: rgba(0, 0, 0, .55); --ombre: 0 18px 40px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--encre);
  font: 400 var(--t-15)/1.45 var(--f-texte);
  padding-left: var(--gouttiere-g);
  padding-right: var(--gouttiere-d);
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fond); }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: var(--t-24); line-height: 1.15; }
h2 { font-size: var(--t-18); line-height: 1.2; }
h3 { font-size: var(--t-15); font-weight: 700; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.chiffre, .tab { font-variant-numeric: tabular-nums; }
.libelle { font-size: var(--t-12); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--doux); white-space: nowrap; }
.doux { color: var(--doux); }
.petit { font-size: var(--t-13); }
:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; border-radius: var(--r-s); }
svg text { font-family: var(--f-texte); }

/* ---------- Bandeau maquette ---------- */
.bandeau-maquette { display: flex; gap: var(--e-3); justify-content: space-between; flex-wrap: wrap; padding: 6px 0; font-size: var(--t-12); color: var(--doux); }
.bandeau-maquette b { color: var(--encre); font-weight: 600; }

/* ---------- Cadre ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e-6); align-items: start; }
main { min-width: 0; padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
.vue { display: grid; gap: var(--e-6); min-width: 0; }
@media (min-width: 1024px) {
  .app { grid-template-columns: 248px minmax(0, 1fr); }
  main { padding-bottom: var(--e-8); padding-top: var(--e-2); }
}

/* ---------- Composants communs ---------- */
/* Boutons : principal (plein encre), secondaire (bordé), discret, rond. 40 px minimum. */
.bouton { display: inline-flex; align-items: center; justify-content: center; gap: var(--e-2); min-height: 40px; padding: 0 var(--e-4); border-radius: var(--r-m); border: 1px solid var(--trait-fort); background: var(--surface); font-weight: 600; font-size: var(--t-15); cursor: pointer; text-decoration: none; white-space: nowrap; }
.bouton.principal { background: var(--encre); color: var(--sur-plein); border-color: var(--encre); }
.bouton.discret { border-color: transparent; background: transparent; }
.bouton.rond { width: 40px; padding: 0; border-radius: var(--r-pill); }
.bouton svg { width: 18px; height: 18px; flex: none; }
.bouton:hover { border-color: var(--encre); }
/* Un seul style actif : fond encre, texte sur-plein */
.segmente { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-pill); background: var(--surface-2); max-width: 100%; }
.segmente button, .segmente a { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 var(--e-3); border: 0; border-radius: var(--r-pill); background: transparent; font-weight: 600; font-size: var(--t-13); cursor: pointer; text-decoration: none; white-space: nowrap; }
.segmente [aria-pressed="true"], .segmente [aria-current="page"] { background: var(--encre); color: var(--sur-plein); }
.segmente svg { width: 16px; height: 16px; }
.pastille-sport { width: 10px; height: 10px; border-radius: var(--r-pill); display: inline-block; flex: none; }
.pastille-sport.football { background: var(--foot); } .pastille-sport.nba { background: var(--nba); }

/* Étiquettes : une forme, quatre couleurs d'état + neutre */
.etiq { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: var(--r-s); font-size: var(--t-12); font-weight: 600; line-height: 18px; background: var(--surface-2); color: var(--encre); white-space: nowrap; }
.etiq.ok { background: var(--ok-doux); color: var(--ok); }
.etiq.attention { background: var(--attention-doux); color: var(--attention); }
.etiq.stop { background: var(--stop-doux); color: var(--stop); }
.etiq.capitaine { background: var(--encre); color: var(--sur-plein); }
.etiq.etoiles { background: transparent; color: var(--encre); padding: 0; gap: 2px; }
.etiq.etoiles svg { width: 13px; height: 13px; fill: var(--or-plein); stroke: var(--or); stroke-width: 1; }

/* Pastilles de forme V/N/D */
.forme { display: inline-flex; gap: 3px; }
.vnd { width: 16px; height: 16px; border-radius: var(--r-s); display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; line-height: 1; }
.vnd.V { background: var(--ok); color: var(--sur-plein); }
.vnd.N { background: var(--surface-2); color: var(--encre); box-shadow: inset 0 0 0 1px var(--trait-fort); }
.vnd.D { background: var(--stop); color: var(--sur-plein); }
.forme.grand .vnd { width: 24px; height: 24px; font-size: var(--t-12); }

/* Surfaces : niveau 1 = surface bordée ; niveau 2 = volet avec ombre */
.surface { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-m); padding: var(--e-4); min-width: 0; }
.section-titre { display: flex; align-items: baseline; justify-content: space-between; gap: var(--e-3); flex-wrap: wrap; }

/* Chiffres clés */
.cles { display: flex; flex-wrap: wrap; gap: var(--e-4) var(--e-8); }
.cle { display: grid; gap: 2px; min-width: 0; }
.cle .valeur { font-family: var(--f-display); font-weight: 500; font-size: var(--t-24); line-height: 1.1; font-variant-numeric: tabular-nums; }
.cle .valeur small { font-size: var(--t-13); font-family: var(--f-texte); font-weight: 600; color: var(--doux); }

/* Barre de chances avec repère du seuil */
.chances { display: grid; gap: 4px; justify-items: end; }
.chances b { font-size: var(--t-18); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.barre-p { position: relative; width: 72px; height: 6px; border-radius: var(--r-pill); background: var(--surface-2); }
.barre-p i { position: absolute; inset: 0 auto 0 0; border-radius: var(--r-pill); background: var(--doux); }
.barre-p.ok i { background: var(--ok); } .barre-p.sous i { background: var(--attention); }
.barre-p u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--encre); border-radius: 1px; }
.chances.sous b { color: var(--attention); } .chances.ok b { color: var(--ok); }

/* ---------- Barre latérale (PC) ---------- */
.laterale { display: none; }
@media (min-width: 1024px) {
  .laterale { display: flex; flex-direction: column; gap: var(--e-4); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); max-height: calc(100vh - 44px); overflow: auto; padding: var(--e-4); background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-m); margin-top: var(--e-2); }
}
.marque { display: flex; align-items: center; gap: var(--e-2); font-family: var(--f-display); font-weight: 700; font-size: var(--t-13); text-decoration: none; white-space: nowrap; }
.marque svg { width: 26px; height: 26px; }
.nav-accueil { display: flex; align-items: center; gap: var(--e-2); min-height: 40px; padding: 0 var(--e-3); border-radius: var(--r-m); text-decoration: none; font-weight: 600; }
.nav-accueil svg { width: 18px; height: 18px; }
.nav-accueil[aria-current="page"], .niveau[aria-pressed="true"], .mode[aria-current="page"] { background: var(--encre); color: var(--sur-plein); }
.niveaux { display: grid; gap: var(--e-2); }
.niveau { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px var(--e-3); padding: var(--e-3); border-radius: var(--r-m); border: 1px solid var(--trait); background: var(--surface); cursor: pointer; text-align: left; }
.niveau .nom { font-family: var(--f-display); font-weight: 700; font-size: var(--t-15); }
.niveau .p { font-family: var(--f-display); font-weight: 500; font-size: var(--t-18); font-variant-numeric: tabular-nums; }
.niveau .sous { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: end; gap: var(--e-2); font-size: var(--t-12); }
.niveau[aria-pressed="true"] .doux { color: inherit; opacity: .78; }
.niveau svg.marches { width: 84px; height: 26px; }
.modes { display: grid; gap: 2px; }
.mode { display: flex; align-items: center; gap: var(--e-3); min-height: 40px; padding: 0 var(--e-3); border-radius: var(--r-m); text-decoration: none; font-weight: 600; }
.mode svg { width: 18px; height: 18px; }
.mode .n { margin-left: auto; font-size: var(--t-12); font-variant-numeric: tabular-nums; opacity: .75; }
.etat-palier { display: grid; gap: var(--e-2); padding: var(--e-3); border-radius: var(--r-m); background: var(--attention-doux); color: var(--encre); font-size: var(--t-13); }
.etat-palier b { color: var(--attention); }
.etat-palier .bouton { width: 100%; font-size: var(--t-13); white-space: normal; }
.pied-laterale { margin-top: auto; display: grid; gap: var(--e-2); padding-top: var(--e-3); border-top: 1px solid var(--trait); }
.pied-laterale .rangee { display: flex; gap: var(--e-2); align-items: center; }

/* ---------- Barre du haut + onglets du bas (téléphone, tablette) ---------- */
.barre-haut { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: var(--e-2); min-height: 52px; background: var(--fond); margin-inline: calc(-1 * var(--gouttiere-g)) calc(-1 * var(--gouttiere-d)); padding-left: var(--gouttiere-g); padding-right: var(--gouttiere-d); border-bottom: 1px solid var(--trait); }
.barre-haut .droite { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.barre-haut .age { font-size: var(--t-12); color: var(--doux); font-variant-numeric: tabular-nums; }
.onglets-bas { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px var(--gouttiere-d) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gouttiere-g); background: var(--surface); border-top: 1px solid var(--trait); }
.onglets-bas a { display: grid; justify-items: center; gap: 2px; padding: 4px 0; min-height: 48px; border-radius: var(--r-m); text-decoration: none; font-size: var(--t-12); font-weight: 600; color: var(--doux); }
.onglets-bas a svg { width: 22px; height: 22px; }
.onglets-bas a[aria-current="page"] { background: var(--encre); color: var(--sur-plein); }
@media (min-width: 1024px) { .barre-haut, .onglets-bas { display: none; } }
@media (max-width: 380px) { .barre-haut .age { display: none; } .segmente.sport span { display: none; } }

/* ---------- Accueil : scène ---------- */
.scene { position: relative; overflow: hidden; border-radius: var(--r-m); background: linear-gradient(180deg, var(--ciel-haut), var(--ciel-bas)); border: 1px solid var(--trait); min-height: 330px; }
.scene canvas { display: block; width: 100%; height: 330px; }
.scene .etiquettes { position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; pointer-events: none; }
.etq { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 1px; padding: 3px 8px; border-radius: var(--r-s); background: var(--surface); border: 1px solid var(--trait); font-size: var(--t-12); line-height: 1.2; white-space: nowrap; transition: opacity .25s; will-change: transform; }
.etq b { font-family: var(--f-display); font-weight: 700; font-size: var(--t-13); font-variant-numeric: tabular-nums; }
.etq.passe { color: var(--doux); }
.etq.passe b { font-weight: 500; }
.etq.actuel { background: var(--encre); color: var(--sur-plein); border-color: var(--encre); padding: 4px 10px; }
.etq.actuel b { font-size: var(--t-18); }
.etq svg { width: 11px; height: 11px; vertical-align: -1px; }
.scene .repli { display: block; width: 100%; height: auto; padding: 56px var(--e-4) var(--e-4); }
.scene-haut { position: absolute; left: var(--e-4); right: var(--e-4); top: var(--e-4); display: flex; justify-content: space-between; align-items: start; gap: var(--e-3); flex-wrap: wrap; pointer-events: none; }
.scene-haut > * { pointer-events: auto; }
.scene-haut .titre { display: grid; gap: 2px; }
.scene-haut h1 { font-size: var(--t-18); }
.scene-note { display: none; position: absolute; right: var(--e-3); bottom: var(--e-2); font-size: var(--t-12); color: var(--doux); }
.carte-heros { display: grid; gap: var(--e-4); }
.heros-p { display: flex; align-items: baseline; gap: var(--e-3); flex-wrap: wrap; }
.heros-p .grand { font-family: var(--f-display); font-weight: 700; font-size: var(--t-heros); line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.heros-p .grand.faible { color: var(--attention); }
.heros-p .texte { font-size: var(--t-15); color: var(--doux); max-width: 16ch; }
.carte-heros .cles { gap: var(--e-3) var(--e-6); }
.heros-p .texte b { color: var(--encre); }
.actions { display: flex; gap: var(--e-2); flex-wrap: wrap; }
@media (min-width: 760px) {
  .scene { min-height: 580px; }
  .scene canvas { height: 580px; }
  .carte-heros .note-maquette { display: none; }
  .scene .repli { padding: 80px 24px 220px 40%; }
  .scene-haut h1 { font-size: var(--t-32); }
  .scene-note { display: block; }
  .carte-heros { position: absolute; left: var(--e-4); bottom: var(--e-4); width: min(420px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-m); padding: var(--e-4) var(--e-6) var(--e-6); box-shadow: var(--ombre); }
}
@media (max-width: 759px) { .carte-heros { padding: var(--e-4); background: var(--surface); border-top: 1px solid var(--trait); } }
@media (max-width: 1023px) { #scene-sport { display: none; } }
.accueil-bas { display: grid; gap: var(--e-6); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) { .accueil-bas { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
.plateaux-mini { display: grid; gap: var(--e-3); }
.plateau-mini { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--e-2) var(--e-3); align-items: center; padding: var(--e-3); border: 1px solid var(--trait); border-radius: var(--r-m); background: var(--surface); text-align: left; cursor: pointer; }
.plateau-mini[aria-pressed="true"] { border-color: var(--encre); box-shadow: inset 0 0 0 1px var(--encre); }
.plateau-mini .nom { display: flex; align-items: center; gap: var(--e-2); font-weight: 700; }
.plateau-mini .p { font-family: var(--f-display); font-size: var(--t-24); font-weight: 500; font-variant-numeric: tabular-nums; }
.plateau-mini svg { grid-column: 1 / -1; width: 100%; height: auto; }

/* ---------- Distribution, 5 jouent, contributions ---------- */
.graphe { width: 100%; min-height: 20px; }
.graphe svg { display: block; overflow: visible; }
.cinq { display: flex; gap: 3px; align-items: end; height: 22px; }
.cinq i { width: 14px; background: var(--surface-2); border-radius: 3px; position: relative; height: 100%; overflow: hidden; }
.cinq i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--p); background: var(--doux); }
.cinq i.sous::after { background: var(--attention); }
.empilee { display: flex; height: 14px; border-radius: var(--r-s); overflow: hidden; background: var(--surface-2); position: relative; }
.empilee span { height: 100%; border-right: 2px solid var(--surface); }
.legende-empilee { display: flex; flex-wrap: wrap; gap: 4px var(--e-3); font-size: var(--t-12); color: var(--doux); }
.legende-empilee i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.seize { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); gap: 1px; height: 14px; }
.seize i { background: var(--surface-2); }
.seize i:nth-child(2n) { margin-right: 2px; }

/* ---------- Petits graphiques (SVG en chaîne, couleurs en jetons) ---------- */
function barreChances(p, { grand = false } = {}) {
  const cl = p >= .99 ? "ok" : p < ETAT.seuil ? "sous" : "";
  const w = grand ? "100%" : "72px";
  return `<div class="chances ${cl}" ${grand ? 'style="justify-items:start"' : ""} title="Chances de jouer ${pc(p)} · seuil ${pc(ETAT.seuil)}"><b ${grand ? 'style="font-family:var(--f-display);font-size:var(--t-32);font-weight:500"' : ""}>${pc(p)}</b><span class="barre-p ${cl}" style="width:${w}"><i style="width:${p * 100}%"></i><u style="left:calc(${ETAT.seuil * 100}% - 1px)"></u></span></div>`;
}
function svgIntervalle(j, w = 72) {
  const f = fourchette(j), E = ECHELLE[j.sport], x = v => 2 + Math.max(0, Math.min(1, v / E)) * (w - 4);
  return `<svg width="${w}" height="16" viewBox="0 0 ${w} 16" role="img" aria-label="Score s'il joue ${j.scoreSiJoue}, fourchette ${Math.round(f.q10)} à ${Math.round(f.q90)}"><title>Fourchette 10-90 % de ses matchs joués : ${Math.round(f.q10)} à ${Math.round(f.q90)}</title>
  <line x1="2" x2="${w - 2}" y1="8" y2="8" stroke="var(--trait)" stroke-width="1"/>
  <line x1="${x(E / 2)}" x2="${x(E / 2)}" y1="5" y2="11" stroke="var(--trait)" stroke-width="1"/>
  <line x1="${x(f.q10)}" x2="${x(f.q90)}" y1="8" y2="8" stroke="var(--serie-b)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="${x(j.scoreSiJoue)}" cy="8" r="3.6" fill="var(--serie-a)" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
}
function pastilles(liste, grand) {
  return `<span class="forme ${grand ? "grand" : ""}">${liste.map(r => `<span class="vnd ${r.res}" title="${r.res} ${esc(r.score)} ${r.domicile ? "contre" : "à"} ${esc(r.adversaire)}">${r.res}</span>`).join("")}</span>`;
}
function marchesMini(s, w = 84, h = 26) {
  const c = CIBLES[s], niv = PAL[s].niveau, mn = c[0], mx = c[5], bw = (w - 5 * 3) / 6;
  return `<svg class="marches" viewBox="0 0 ${w} ${h}" aria-hidden="true">${c.map((v, i) => { const hh = 6 + (v - mn) / (mx - mn) * (h - 8); const x = i * (bw + 3); const col = i + 1 < niv ? `var(--${s === "football" ? "foot" : "nba"}-doux)` : i + 1 === niv ? `var(--${s === "football" ? "foot" : "nba"})` : "var(--trait)"; return `<rect x="${x}" y="${h - hh}" width="${bw}" height="${hh}" rx="2" fill="${col}"/>`; }).join("")}</svg>`;
}
/* Chemin des paliers en SVG : repli de la scène 3D et vignette de l'accueil */
function cheminSVG(s, { w = 640, h = 230, compact = false } = {}) {
  const c = CIBLES[s], niv = PAL[s].niveau, mn = c[0], mx = c[5], sc = s === "football" ? "foot" : "nba";
  const pad = 10, gap = compact ? 6 : 14, bw = (w - pad * 2 - gap * 5) / 6, base = h - 8, top = compact ? 30 : 54, iso = compact ? 6 : 12;
  let out = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Paliers ${c.join(", ")} ; palier en cours ${c[niv - 1]}">`;
  c.forEach((v, i) => {
    const hh = 18 + (v - mn) / (mx - mn) * (base - top - 18 - iso), x = pad + i * (bw + gap), y = base - hh;
    const etat = i + 1 < niv ? "passe" : i + 1 === niv ? "actuel" : "futur";
    const face = etat === "actuel" ? `var(--${sc})` : etat === "passe" ? `var(--${sc}-doux)` : "var(--surface-2)";
    const dessus = etat === "actuel" ? "var(--pierre)" : etat === "passe" ? `var(--${sc}-doux)` : "var(--surface)";
    out += `<polygon points="${x},${y} ${x + iso},${y - iso} ${x + bw + iso},${y - iso} ${x + bw},${y}" fill="${dessus}" stroke="var(--trait-fort)" stroke-width="1"/>`;
    out += `<polygon points="${x + bw},${y} ${x + bw + iso},${y - iso} ${x + bw + iso},${base - iso} ${x + bw},${base}" fill="var(--trait)" stroke="var(--trait-fort)" stroke-width="1"/>`;
    out += `<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${face}" stroke="var(--trait-fort)" stroke-width="1"/>`;
    const fs = compact ? 11 : 14;
    out += `<text x="${x + bw / 2 + iso / 2}" y="${y - iso - (etat === "actuel" ? (compact ? 16 : 26) : 6)}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${etat === "futur" ? "var(--doux)" : "var(--encre)"}" style="font-family:var(--f-display)">${v}</text>`;
    if (etat === "actuel") out += `<circle cx="${x + bw / 2 + iso / 2}" cy="${y - iso / 2 - (compact ? 6 : 10)}" r="${compact ? 5 : 8}" fill="var(--marqueur)"/>`;
    if (!compact) out += `<text x="${x + bw / 2}" y="${base - 8}" text-anchor="middle" font-size="12" fill="${etat === "actuel" ? "var(--sur-plein)" : "var(--doux)"}">${i + 1}</text>`;
  });
  return out + "</svg>";
}
/* Distribution du score de l'équipe face à la cible (mesurée à la largeur réelle) */
function svgDistribution(sim, cible, w, h) {
  const lo = Math.max(0, Math.floor(Math.min(sim.q01, cible * .7) / 50) * 50), hi = Math.ceil(Math.max(sim.q99, cible * 1.15) / 50) * 50;
  const nb = 36, larg = (hi - lo) / nb, comptes = new Array(nb).fill(0);
  for (const v of sim.scores) { const k = Math.min(nb - 1, Math.max(0, Math.floor((v - lo) / larg))); comptes[k]++; }
  const mx = Math.max(...comptes), m = { g: 4, d: 4, h: 26, b: 22 }, iw = w - m.g - m.d, ih = h - m.h - m.b;
  const X = v => m.g + (v - lo) / (hi - lo) * iw, bwid = iw / nb;
  let o = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Distribution simulée du score de l'équipe : ${pc(sim.pPasser)} au-dessus de la cible ${cible}">`;
  o += `<line x1="${m.g}" x2="${w - m.d}" y1="${m.h + ih}" y2="${m.h + ih}" stroke="var(--trait-fort)" stroke-width="1"/>`;
  comptes.forEach((c, k) => {
    const v0 = lo + k * larg, hh = c / mx * ih, passe = v0 + larg / 2 >= cible;
    o += `<rect x="${(X(v0) + .5).toFixed(1)}" y="${(m.h + ih - hh).toFixed(1)}" width="${Math.max(1, bwid - 1.5).toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" fill="${passe ? "var(--ok)" : "var(--trait-fort)"}" opacity="${passe ? 1 : .55}"/>`;
  });
  const pas = (hi - lo) > 300 ? 100 : 50;
  for (let v = Math.ceil(lo / pas) * pas; v <= hi; v += pas) o += `<text x="${X(v)}" y="${h - 6}" text-anchor="middle" font-size="12" fill="var(--doux)" class="tab">${v}</text>`;
  const xc = X(cible);
  o += `<line x1="${xc}" x2="${xc}" y1="4" y2="${m.h + ih}" stroke="var(--encre)" stroke-width="2"/>`;
  o += `<text x="${xc - 6}" y="14" text-anchor="end" font-size="12" font-weight="700" fill="var(--encre)">cible ${cible}</text>`;
  o += `<text x="${xc + 6}" y="14" text-anchor="start" font-size="12" fill="var(--ok)" font-weight="700">${pc(sim.pPasser)} au-delà</text>`;
  const xm = X(sim.moyenne);
  o += `<path d="M${xm - 5},${m.h + ih + 7} L${xm + 5},${m.h + ih + 7} L${xm},${m.h + ih + 1} Z" fill="var(--serie-a)"/>`;
  return o + "</svg>";
}
/* Historique : échelle fixe du sport, espacement selon les dates (intersaison resserrée), bande 10-90 %, projection, 3 derniers */
function svgHistorique(j, w) {
  const H = j.historique15, E = ECHELLE[j.sport], h = 230, m = { g: 30, d: 8, h: 18, b: 34 }, ih = h - m.h - m.b, iw = w - m.g - m.d;
  const jours = H.map(x => new Date(x.date + "T12:00:00Z").getTime() / 864e5);
  const pos = [0], coupures = [];
  for (let i = 1; i < H.length; i++) { const g = jours[i] - jours[i - 1]; const gg = g > 21 ? 9 : g; pos.push(pos[i - 1] + gg); if (g > 21) coupures.push(i); }
  const tot = pos[pos.length - 1] || 1, pasMin = iw / (H.length + .5);
  const X = i => m.g + pasMin / 2 + pos[i] / tot * (iw - pasMin);
  const bw = Math.min(26, pasMin * .62), Y = v => m.h + ih - Math.min(v, E) / E * ih;
  const f = fourchette(j);
  let o = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Historique des 15 derniers matchs de ${esc(j.nom)}">`;
  for (let v = 0; v <= E; v += E / 4) o += `<line x1="${m.g}" x2="${w - m.d}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--trait)" stroke-width="1" ${v ? 'stroke-dasharray="2 4"' : ""}/><text x="${m.g - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--doux)">${v}</text>`;
  o += `<rect x="${m.g}" y="${Y(f.q90)}" width="${iw}" height="${Y(f.q10) - Y(f.q90)}" fill="var(--bande)" opacity=".9"/>`;
  coupures.forEach(i => { const xc = (X(i) + X(i - 1)) / 2; o += `<line x1="${xc}" x2="${xc}" y1="${m.h}" y2="${m.h + ih}" stroke="var(--trait-fort)" stroke-dasharray="3 3"/><text x="${xc}" y="${m.h - 6}" text-anchor="middle" font-size="11" fill="var(--doux)">pause</text>`; });
  H.forEach((x, i) => {
    const cx = X(i), joue = JOUE.has(x.situation), recent = i >= H.length - 3;
    if (joue) {
      const y = Y(x.score || 0), hh = m.h + ih - y;
      const fill = x.situation === "entre" ? "var(--serie-b)" : "var(--serie-a)";
      o += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(1, hh)}" rx="3" fill="${fill}" stroke="var(--serie-a)" stroke-width="${x.situation === "entre" ? 1.2 : 0}"><title>${x.date} · ${x.situation === "entre" ? "entré en jeu" : x.situation === "joue" ? "a joué" : "titulaire"} · ${x.score} pts${x.minutes != null ? " · " + x.minutes + " min" : ""}</title></rect>`;
      o += `<text x="${cx}" y="${y - 4}" text-anchor="middle" font-size="11" font-weight="${recent ? 700 : 400}" fill="var(--encre)">${x.score}</text>`;
    } else {
      o += `<rect x="${cx - bw / 2 + .75}" y="${m.h + .75}" width="${bw - 1.5}" height="${ih - 1.5}" rx="3" fill="none" stroke="${x.situation === "absent" ? "var(--stop)" : "var(--trait-fort)"}" stroke-dasharray="3 3" stroke-width="1.5"><title>${x.date} · ${x.situation === "absent" ? "absent de la feuille" : "resté sur le banc"} · 0 pt</title></rect>`;
      o += `<text x="${cx}" y="${m.h + ih - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="${x.situation === "absent" ? "var(--stop)" : "var(--doux)"}">${x.situation === "absent" ? "A" : "B"}</text>`;
    }
  });
  // projection et moyenne des 3 derniers matchs joués
  const yp = Y(j.scoreSiJoue);
  o += `<line x1="${m.g}" x2="${w - m.d}" y1="${yp}" y2="${yp}" stroke="var(--encre)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  o += `<text x="${m.g + 4}" y="${yp - 5}" font-size="11" font-weight="700" fill="var(--encre)">s'il joue ${j.scoreSiJoue}</text>`;
  const y3 = Y(j.formeJoueur.moyenne3), x3a = X(H.length - 3) - bw / 2 - 3, x3b = X(H.length - 1) + bw / 2 + 3;
  o += `<line x1="${x3a}" x2="${x3b}" y1="${y3}" y2="${y3}" stroke="var(--attention)" stroke-width="3" stroke-linecap="round"/>`;
  // mois sous l'axe
  let dernierMois = "";
  H.forEach((x, i) => { const mo = new Date(x.date + "T12:00:00Z").toLocaleDateString("fr-FR", { month: "short", timeZone: PARIS }); if (mo !== dernierMois) { dernierMois = mo; o += `<text x="${X(i)}" y="${h - 14}" text-anchor="middle" font-size="11" fill="var(--doux)">${mo}</text>`; } });
  o += `<text x="${X(H.length - 1)}" y="${h - 1}" text-anchor="end" font-size="11" fill="var(--doux)">${new Date(H[H.length - 1].date + "T12:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</text>`;
  return o + "</svg>";
}
function barreButs(f, sport) {
  const mx = Math.max(f.butsPour, f.butsContre) * 1.1 || 1, unite = sport === "nba" ? "points" : "buts";
  return `<div style="display:grid;gap:4px;font-size:var(--t-13)">
    <div style="display:grid;grid-template-columns:76px 1fr 40px;gap:8px;align-items:center"><span class="doux">marqués</span><span style="height:8px;border-radius:4px;background:var(--surface-2)"><i style="display:block;height:100%;width:${f.butsPour / mx * 100}%;background:var(--serie-a);border-radius:4px"></i></span><b class="tab" style="text-align:right">${nf(f.butsPour, 1)}</b></div>
    <div style="display:grid;grid-template-columns:76px 1fr 40px;gap:8px;align-items:center"><span class="doux">encaissés</span><span style="height:8px;border-radius:4px;background:var(--surface-2)"><i style="display:block;height:100%;width:${f.butsContre / mx * 100}%;background:var(--serie-b);border-radius:4px"></i></span><b class="tab" style="text-align:right">${nf(f.butsContre, 1)}</b></div>
    <span class="doux" style="font-size:var(--t-12)">${unite} par match, 10 derniers matchs</span></div>`;
}

/* ---------- Ligne joueur (un composant) ---------- */
function ligne(j, { i = null, compacte = false, cap = null, cartes = false } = {}) {
  const m = j.match, adv = (m.lieu === "domicile" ? "vs " : "@ ") + m.adversaire;
  const etoiles = j.sport === "nba" ? `<span class="etiq etoiles" title="${nf(j.etoiles, 1)} étoiles">${ICO.etoile}${nf(j.etoiles, j.etoiles % 1 ? 1 : 0)}</span>` : "";
  const bonus = j.bonusPct ? `<span class="etiq">${esc(j.collection)} +${j.bonusPct} %</span>` : "";
  const capi = cap && cap === j.carteId ? `<span class="etiq capitaine" title="Capitaine : score × 1,5">C</span>` : "";
  const choisie = (ETAT.joueur[j.sport] || "") === j.carteId ? " choisie" : "";
  return `<div class="ligne${compacte ? " compacte" : ""}${choisie}" role="button" tabindex="0" data-carte="${esc(j.carteId)}">
    <div class="c-carte"><img src="${j.vignette}" alt="" loading="lazy"></div>
    <div class="c-joueur"><span class="nom">${esc(j.nom)}</span>${capi}${etoiles}${compacte ? "" : bonus}<span class="sous">${poste(j, i)} · ${esc(j.club)}</span></div>
    <div class="c-poste">${poste(j, i)}</div>
    <div class="c-match"><span class="l1">${compacte ? "" : `<span class="pp">${poste(j, i)} · </span>`}${dateCourte(m.coupEnvoiUTC)}</span><span class="l2">${esc(adv)}${m.victoirePct != null ? " · " + m.victoirePct + " % de victoire" : ""}</span></div>
    <div class="c-forme">${pastilles(j.formeClub.derniers)}</div>
    <div class="c-chances">${barreChances(j.chancesDeJouer)}</div>
    <div class="c-score"><span><b>${j.scoreSiJoue}</b> <span class="lib">s'il joue</span></span>${svgIntervalle(j)}</div>
    <div class="c-esp">${nf(j.esperance, 1)}</div>
    <div class="c-bonus">${j.bonusPct ? esc(j.collection) + " +" + j.bonusPct + " %" : '<span class="doux">—</span>'}</div>
    <div class="c-jouee">${cartes ? `<input type="checkbox" id="jouee-${esc(j.carteId)}" aria-label="Jouée au palier en cours" ${ETAT.jouees.has(j.carteId) ? "checked" : ""}>` : ""}</div>
  </div>`;
}
function entete(cartes) {
  return `<div class="ligne entete" aria-hidden="true"><div class="c-carte"></div><div class="c-joueur">Joueur</div><div class="c-poste">Poste</div><div class="c-match">Match</div><div class="c-forme">Équipe</div><div class="c-chances" style="text-align:right">Chances</div><div class="c-score" style="justify-items:start">S'il joue</div>${cartes ? '<div class="c-esp">Espér.</div><div class="c-bonus">Bonus</div><div class="c-jouee">Jouée</div>' : ""}</div>`;
}

/* ---------- Blocs ---------- */
function cinqJouent(s) {
  const J = joueursDe(s), faible = J.reduce((a, b) => b.chancesDeJouer < a.chancesDeJouer ? b : a);
  const plafond = J.every(j => j.chancesDeJouer >= .93 && j.chancesDeJouer < .99);
  return `<div class="cle"><span class="libelle">Les 5 jouent</span><span class="valeur">${pc(PROP[s].les5Jouent)}</span>
    <span class="cinq" aria-hidden="true">${J.map(j => `<i style="--p:${j.chancesDeJouer * 100}%" class="${j.chancesDeJouer < ETAT.seuil ? "sous" : ""}" title="${esc(j.nom)} ${pc(j.chancesDeJouer)}"></i>`).join("")}</span>
    <span class="doux petit">${plafond ? "Tous à 93 % : plafond avant les compositions" : "Maillon faible : " + esc(faible.nom) + " " + pc(faible.chancesDeJouer)}</span></div>`;
}
function verrouillage(s) { const t = joueursDe(s).map(j => j.match.coupEnvoiUTC).sort()[0]; return dateCourte(t); }
function contributions(s) {
  const J = joueursDe(s), cap = capitaineId(s), cible = PAL[s].cible;
  const parts = J.map((j, k) => ({ j, k, v: j.esperance * (cap === j.carteId ? (1 + j.bonusPct / 100 + .5) / (1 + j.bonusPct / 100) : 1) }));
  const tot = parts.reduce((a, b) => a + b.v, 0), echelle = Math.max(tot, cible) * 1.08;
  return `<div style="display:grid;gap:6px"><div class="section-titre"><span class="libelle">Qui porte l'équipe</span><span class="petit doux tab">espérances : ${nf(tot)} pour ${cible}</span></div>
    <div style="position:relative"><div class="empilee">${parts.map(p => `<span title="${esc(p.j.nom)} ${nf(p.v, 1)}" style="width:${p.v / echelle * 100}%;background:var(--cat-${p.k + 1})"></span>`).join("")}</div>
    <span style="position:absolute;top:-4px;bottom:-4px;left:${cible / echelle * 100}%;width:2px;background:var(--encre)" title="cible ${cible}"></span></div>
    <div class="legende-empilee">${parts.map(p => `<span><i style="background:var(--cat-${p.k + 1})"></i>${esc(p.j.nom.split(" ").slice(-1)[0])} ${nf(p.v, 0)}${cap === p.j.carteId ? " (C)" : ""}</span>`).join("")}</div></div>`;
}
function seizeEtoiles(s) {
  const J = joueursDe(s); let cells = [], k = 0;
  J.forEach((j, n) => { for (let h = 0; h < j.etoiles * 2; h++) cells.push(`<i style="background:var(--cat-${n + 1})" title="${esc(j.nom)} ${nf(j.etoiles, 1)} ★"></i>`); });
  while (cells.length < 32) cells.push("<i></i>");
  const tot = J.reduce((a, b) => a + b.etoiles, 0);
  return `<div style="display:grid;gap:6px"><div class="section-titre"><span class="libelle">Étoiles</span><span class="petit tab"><b>${nf(tot, 1)}</b> / 16</span></div><div class="seize">${cells.join("")}</div></div>`;
}
function etatPalier(s) {
  const p = PAL[s], jouees = p.echecs + (["LIVE", "LINEUP_SET"].includes(p.etat) ? 1 : 0);
  const derniere = p.tentativesRestantes === 0 && ["LIVE", "LINEUP_SET"].includes(p.etat);
  return { jouees, cartes: jouees * 5, derniere, texte: `<b>${jouees} tentatives jouées</b> à ce palier : ${jouees * 5} cartes bloquées, 0 marquée.${derniere ? " Dernière tentative en cours." : ""}` };
}

/* ---------- Vues ---------- */
function rendreLaterale() {
  const s = ETAT.sport;
  document.getElementById("lat-niveaux").innerHTML = SPORTS.map(sp => `<button class="niveau" type="button" data-sport="${sp}" aria-pressed="${sp === s}">
    <span class="pastille-sport ${sp}"></span><span class="nom">${NOM_SPORT[sp]}</span><span class="p">${pc(PROP[sp].chancesDePasser)}</span>
    <span class="sous"><span class="doux tab">Palier ${PAL[sp].niveau} · ${PAL[sp].cible}</span>${marchesMini(sp)}</span></button>`).join("");
  const modes = [["solo", "Solo", ICO.solo], ["squad", "Squad", ICO.squad], ["cartes", "Mes cartes", ICO.cartes]];
  document.getElementById("lat-modes").innerHTML = `<div class="libelle" style="margin:4px 0 6px">${NOM_SPORT[s]}</div>` + modes.map(([v, l, ic]) => `<a class="mode" href="#${v}${s === "nba" ? "-nba" : ""}" ${ETAT.vue === v || (v === "solo" && ETAT.vue === "fiche") ? 'aria-current="page"' : ""}>${ic}${l}${v === "cartes" ? `<span class="n">${s === "football" ? 635 : 394}</span>` : ""}</a>`).join("");
  const e = etatPalier(s);
  document.getElementById("lat-etat").innerHTML = `<span>${e.texte}</span><button class="bouton" type="button" data-marquer>Marquer les cartes jouées</button>`;
  document.querySelector(".nav-accueil").toggleAttribute("aria-current", ETAT.vue === "accueil");
  if (ETAT.vue === "accueil") document.querySelector(".nav-accueil").setAttribute("aria-current", "page");
}
function rendreBarres() {
  const s = ETAT.sport;
  const seg = SPORTS.map(sp => `<button type="button" data-sport="${sp}" aria-pressed="${sp === s}">${sp === "football" ? ICO.foot : ICO.nba}<span>${NOM_SPORT[sp]}</span></button>`).join("");
  document.getElementById("haut-sport").innerHTML = seg;
  document.getElementById("scene-sport").innerHTML = seg;

/* ---------- Scène 3D (three.js r128) : rendu à la demande ---------- */
const Scene = (() => {
  const hote = document.getElementById("scene"), calque = document.getElementById("etiquettes");
  let ok = false, renderer, scene, camera, racine, lum = {}, groupes = {}, iles = {}, etiquettes = {}, marqueurs = {};
  let cibleCam = null, decal = null, parallaxe = { x: 0, y: 0 }, tweens = [], boucle = null, demande = false, mats = [];
  const PTS = [[-6.2, 2.6], [-3.7, -0.3], [-1.1, 2.1], [1.5, -0.5], [3.9, 1.9], [6.3, -0.7]];
  function webglDispo() { try { const c = document.createElement("canvas"); return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl"))); } catch (e) { return false; } }
  const jeton = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function couleur(n) { return new THREE.Color(jeton(n) || "#888"); }
  function mat(n, opts = {}) { const m = new THREE.MeshStandardMaterial({ color: couleur(n), flatShading: true, roughness: .9, metalness: 0, ...opts }); m.userData.jeton = n; mats.push(m); return m; }
  function hash(x, y, z) { const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return s - Math.floor(s); }
  function hauteur(s, i) { const c = CIBLES[s]; return .7 + (c[i] - c[0]) / (c[5] - c[0]) * 2.6; }
  function construire(s) {
    const g = new THREE.Group(), sc = s === "football" ? "--foot" : "--nba", niv = PAL[s].niveau;
    const dalle = new THREE.Mesh(new THREE.CylinderGeometry(9.6, 9.3, .6, 11), mat("--plateau"));
    dalle.position.y = -.3; g.add(dalle);
    const cone = new THREE.ConeGeometry(9.3, 5, 11, 3), p = cone.attributes.position;
    for (let k = 0; k < p.count; k++) { const x = p.getX(k), y = p.getY(k), z = p.getZ(k); if (y > -2.4) { const r = hash(Math.round(x * 100), Math.round(y * 100), Math.round(z * 100)); p.setXYZ(k, x * (0.9 + r * .22), y + (r - .5) * .5, z * (0.9 + hash(Math.round(z * 100), Math.round(x * 100), 3) * .22)); } }
    cone.computeVertexNormals();
    const roche = new THREE.Mesh(cone, mat("--roche")); roche.rotation.x = Math.PI; roche.position.y = -3.1; g.add(roche);
    // chemin de pas entre les paliers
    for (let i = 0; i < 5; i++) for (let t = 1; t <= 2; t++) {
      const a = PTS[i], b = PTS[i + 1], f = t / 3;
      const pas = new THREE.Mesh(new THREE.CylinderGeometry(.32, .36, .14, 6), mat(i + 1 < niv ? sc + "-doux" : "--trait"));
      pas.position.set(a[0] + (b[0] - a[0]) * f, .07, a[1] + (b[1] - a[1]) * f); g.add(pas);
    }
    iles[s] = [];
    PTS.forEach(([x, z], i) => {
      const h = hauteur(s, i), etat = i + 1 < niv ? "passe" : i + 1 === niv ? "actuel" : "futur";
      const cotes = etat === "futur" ? mat("--trait") : etat === "passe" ? mat(sc + "-doux") : mat(sc);
      const dessus = etat === "actuel" ? mat("--pierre") : etat === "passe" ? mat(sc) : mat("--surface");
      const ile = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.32, h, 6), [cotes, dessus, cotes]);
      ile.position.set(x, h / 2, z); ile.rotation.y = hash(i, 2, 7) * Math.PI; g.add(ile);
      iles[s].push({ ile, h, x, z, etat });
    });
    // cristaux décoratifs
    [[-7.4, -3.4], [-4.8, 4.6], [0.6, -4.2], [5.2, 4.4], [7.6, -3.6], [-1.8, -5.6], [2.8, 5.4]].forEach(([x, z], k) => {
      const c = new THREE.Mesh(new THREE.ConeGeometry(.32 + hash(k, 1, 1) * .2, .9 + hash(k, 2, 2) * 1.1, 4), mat("--trait-fort"));
      c.position.set(x, .45 + hash(k, 2, 2) * .5, z); c.rotation.y = hash(k, 3, 3) * 3; g.add(c);
    });
    // marqueur : ballon low-poly + anneau sur le palier en cours
    const act = iles[s][niv - 1];
    const ballon = new THREE.Mesh(new THREE.IcosahedronGeometry(.5, s === "football" ? 1 : 0), mat("--marqueur"));
    ballon.position.set(act.x, act.h + .52, act.z);

  }
  function etiquettesDe(s) {
    const niv = PAL[s].niveau;
    etiquettes[s] = CIBLES[s].map((v, i) => {
      const d = document.createElement("div"), etat = i + 1 < niv ? "passe" : i + 1 === niv ? "actuel" : "futur";
      d.className = "etq " + etat;
      d.innerHTML = etat === "actuel" ? `<span>Palier ${i + 1} · en cours</span><b>${v}</b>` : etat === "passe" ? `<b>${v}</b><span>${ICO.coche} passé</span>` : `<b>${v}</b><span>palier ${i + 1}</span>`;
      calque.appendChild(d); return d;
    });
  }
  function mondeIle(s, angle) {
    const old = racine.rotation.y; racine.rotation.y = angle; racine.updateMatrixWorld(true);
    // la caméra vise entre le palier en cours et le centre du plateau : tout le chemin reste visible
    const v = new THREE.Vector3(), c = new THREE.Vector3(); const it = iles[s][PAL[s].niveau - 1]; it.ile.getWorldPosition(v); groupes[s].getWorldPosition(c);
    v.lerp(c, .55); v.y = it.h * .5;
    racine.rotation.y = old; racine.updateMatrixWorld(true); return v;
  }
  function offsetCam() {
    const w = hote.clientWidth, h = hote.clientHeight, etroit = w < 760;
    return etroit ? new THREE.Vector3(5, 17, 27) : new THREE.Vector3(8.5, 11.5, 20);
  }
  function rendre() {
    if (!ok || !cibleCam) return;
    const off = decal.clone(); off.x += parallaxe.x; off.y += parallaxe.y;
    camera.position.copy(cibleCam).add(off); camera.lookAt(cibleCam);
    renderer.render(scene, camera);
    // étiquettes HTML projetées sur les paliers du plateau de devant
    const w = hote.clientWidth, h = renderer.domElement.clientHeight, v = new THREE.Vector3(), gp = new THREE.Vector3();
    calque.style.height = h + "px";
    for (const s of SPORTS) {
      groupes[s].getWorldPosition(gp); const devant = gp.z > 0;
      iles[s].forEach((it, i) => {
        const el = etiquettes[s][i];
        it.ile.getWorldPosition(v); v.y = it.h + (it.etat === "actuel" ? 1.35 : .25); v.project(camera);
        const vis = devant && v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
        el.style.opacity = vis ? 1 : 0;
        el.style.transform = `translate(${((v.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v.y) / 2 * h).toFixed(1)}px) translate(-50%, -100%)`;
      });
    }
  }
  function demander() { if (demande || document.hidden) return; demande = true; requestAnimationFrame(() => { demande = false; rendre(); }); }
  function tick(t) {
    tweens = tweens.filter(tw => { const k = Math.min(1, (t - tw.t0) / tw.d), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; tw.maj(e); return k < 1; });
    rendre();
    boucle = tweens.length && !document.hidden ? requestAnimationFrame(tick) : null;
  }
  function animer(d, maj) { tweens.push({ t0: performance.now(), d, maj }); if (!boucle && !document.hidden) boucle = requestAnimationFrame(tick); }
  function terminer() { tweens.forEach(tw => tw.maj(1)); tweens = []; if (boucle) cancelAnimationFrame(boucle); boucle = null; rendre(); }
  function taille() {
    if (!ok) return;

    renderer.setSize(w, h, false); camera.aspect = w / h;
    if (w >= 760) camera.setViewOffset(w, h, -w * .2, -h * .04, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix(); decal = offsetCam(); demander();
  }
  function couleurs() { if (!ok) return; mats.forEach(m => m.color.set(couleur(m.userData.jeton))); demander(); }
  function init() {
    if (!window.THREE || reduit || !webglDispo()) return false;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
    } catch (e) { return false; }
    ok = true;
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.setClearColor(0x000000, 0);
    hote.insertBefore(renderer.domElement, hote.firstChild);
    renderer.domElement.setAttribute("aria-hidden", "true");
    scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(30, 1, .1, 200);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7785, .75));
    const soleil = new THREE.DirectionalLight(0xffffff, .85); soleil.position.set(8, 14, 9); scene.add(soleil);
    racine = new THREE.Group(); scene.add(racine);
    SPORTS.forEach((s, k) => { const g = construire(s); g.position.set(0, 0, k ? -10 : 10); g.rotation.y = k ? Math.PI : 0; racine.add(g); groupes[s] = g; etiquettesDe(s); });
    const angle = ETAT.sport === "nba" ? Math.PI : 0; racine.rotation.y = angle; racine.updateMatrixWorld(true);
    taille();
    const fin = mondeIle(ETAT.sport, angle);
    const depart = new THREE.Vector3(0, 0, 10), decalFin = decal.clone(), decalDepart = decal.clone().multiplyScalar(1.7);
    cibleCam = depart.clone(); decal = decalDepart.clone();
    animer(1800, e => { cibleCam.lerpVectors(depart, fin, e); decal.lerpVectors(decalDepart, decalFin, e); });
    new ResizeObserver(taille).observe(hote);
    hote.addEventListener("pointermove", ev => { if (ev.pointerType !== "mouse") return; const r = hote.getBoundingClientRect(); parallaxe.x = ((ev.clientX - r.left) / r.width - .5) * 1.6; parallaxe.y = ((ev.clientY - r.top) / r.height - .5) * -.8; if (!boucle) demander(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) { if (boucle) cancelAnimationFrame(boucle); boucle = null; } else if (tweens.length) terminer(); });
    return true;
  }
  function allerA(s) {
    if (!ok) return;
    const a0 = racine.rotation.y, a1 = s === "nba" ? Math.PI : 0; if (Math.abs(a0 - a1) < 1e-3) return;

    animer(1200, e => { racine.rotation.y = a0 + (a1 - a0) * e; cibleCam.lerpVectors(t0, t1, e); cibleCam.y += Math.sin(e * Math.PI) * 1.2; });
  }
  return { init, allerA, couleurs, actif: () => ok, demander };
})();
function repliScene() {
  const hote = document.getElementById("scene");
  let r = hote.querySelector(".repli"); if (!r) { r = document.createElement("div"); r.className = "repli"; hote.insertBefore(r, hote.firstChild); }
  r.innerHTML = cheminSVG(ETAT.sport, { w: 640, h: 230 });
  document.getElementById("scene-note").textContent = "Chemin des paliers (3D désactivée : mouvement réduit ou WebGL absent)";
}

/* ---------- Navigation ---------- */
const VUES = ["accueil", "solo", "squad", "fiche", "cartes"];
function lireAdresse() {
  const h = (location.hash || "#accueil").slice(1);
  const [v, sp] = h.split("-");
  ETAT.vue = VUES.includes(v) ? v : "accueil";
  if (sp === "nba" || sp === "football") ETAT.sport = sp;
  else if (h === v) { /* garde le sport en cours */ }
}
let sceneLancee = false;
function afficher() {
  VUES.forEach(v => document.getElementById("v-" + v).hidden = v !== ETAT.vue);
  rendreLaterale(); rendreBarres();
  const r = { accueil: rendreAccueil, solo: rendreSolo, squad: rendreSquad, fiche: rendreFiche, cartes: rendreCartes }[ETAT.vue];
  r();
  if (ETAT.vue === "accueil") {
    if (!sceneLancee) { sceneLancee = true; if (!Scene.init()) repliScene(); }
    else if (Scene.actif()) { Scene.allerA(ETAT.sport); Scene.demander(); } else repliScene();
  }
  dessinerGraphes(document.getElementById("v-" + ETAT.vue));
}
function changerSport(s) {
  if (s === ETAT.sport) return;
  ETAT.sport = s; ETAT.poste = "tous";
  const suf = s === "nba" ? "-nba" : "";
  history.replaceState(null, "", "#" + ETAT.vue + suf);
  afficher();
}
addEventListener("hashchange", () => { const avant = ETAT.vue; lireAdresse(); afficher(); if (avant !== ETAT.vue) scrollTo(0, 0); });

/* ---------- Thème ---------- */
function estSombre() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
try { const t = localStorage.getItem("sorare-aide-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
function basculerTheme() {
  const t = estSombre() ? "light" : "dark"; document.documentElement.dataset.theme = t;
  try { localStorage.setItem("sorare-aide-theme", t); } catch (e) {}
  rendreBarres(); Scene.couleurs();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { rendreBarres(); Scene.couleurs(); });

/* ---------- Événements ---------- */
let minuterie;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(minuterie); minuterie = setTimeout(() => el.hidden = true, 2600); }
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, [data-carte], input");
  if (!t) return;
  if (t.matches("input[type=checkbox]")) { ev.stopPropagation(); const id = t.closest("[data-carte]").dataset.carte; t.checked ? ETAT.jouees.add(id) : ETAT.jouees.delete(id); toast(t.checked ? "Carte marquée jouée au palier en cours" : "Marque retirée"); return; }
  if (t.dataset.sport) return changerSport(t.dataset.sport);
  if (t.dataset.seuil) { ETAT.seuil = +t.dataset.seuil; delete CHOIX.football; delete CHOIX.nba; return afficher(); }
  if (t.dataset.poste) { ETAT.poste = t.dataset.poste; return rendreCartes(); }
  if (t.hasAttribute("data-theme-bascule")) return basculerTheme();
  if (t.hasAttribute("data-maj")) return toast("Maquette : la mise à jour n'est pas branchée");
  if (t.hasAttribute("data-aide")) return toast("Maquette : l'aide n'est pas rédigée");
  if (t.hasAttribute("data-marquer") || t.hasAttribute("data-maquette")) return toast("Maquette : action sans effet");
  if (t.dataset.carte) {
    const j = PARCARTE.get(t.dataset.carte); ETAT.joueur[j.sport] = j.carteId;
    const sf = document.getElementById("solo-fiche");
    if (ETAT.vue === "solo" && sf && getComputedStyle(sf).display !== "none") { rendreSolo(); dessinerGraphes(document.getElementById("v-solo")); return; }
    location.hash = "#fiche" + (j.sport === "nba" ? "-nba" : "");
    if (ETAT.vue === "fiche") { rendreFiche(); dessinerGraphes(document.getElementById("v-fiche")); }
  }
});
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".ligne[data-carte]")) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener("change", ev => { if (ev.target.id === "tri-cartes") { ETAT.tri = ev.target.value; rendreCartes(); } });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => dessinerGraphes(document.getElementById("v-" + ETAT.vue)), 120); });

/* ---------- Démarrage ---------- */
(function () {
  const iso = (D.note.match(/\d{4}-\d{2}-\d{2}T[\d:.]+Z/) || [])[0];
  const quand = iso ? new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: PARIS }) : "";
  document.getElementById("note-donnees").textContent = iso ? "Données réelles de yapapir, " + dateCourte(iso) : "";
  document.getElementById("haut-age").textContent = quand;
  document.getElementById("lat-age").textContent = iso ? "Données Sorare de " + dateCourte(iso) : "";
  lireAdresse(); afficher();
})();
