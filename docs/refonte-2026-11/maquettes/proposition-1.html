  --lueur-filtre: none;

  --t-12: 12px; --t-13: 13px; --t-15: 15px; --t-18: 18px; --t-24: 24px; --t-32: 32px;

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--encre);
  font: 400 var(--t-15)/1.45 var(--police);
  overflow-x: clip;
}
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--chiffres); font-weight: 600; letter-spacing: .01em; line-height: 1.1; }
h1 { font-size: var(--t-32); }
h2 { font-size: var(--t-24); }
h3 { font-size: var(--t-15); font-weight: 600; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.chiffre, .num { font-family: var(--chiffres); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.libelle { font-size: var(--t-12); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--doux); white-space: nowrap; }
.doux { color: var(--doux); }
.petit { font-size: var(--t-13); }
.tnum { font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic.plein { fill: currentColor; stroke: none; }
.ic-16 { width: 16px; height: 16px; }
:focus-visible { outline: 2px solid var(--projo); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.bandeau-maquette {
  font-size: var(--t-12); color: var(--doux); background: var(--surface);
  border-bottom: 1px solid var(--trait); text-align: center; padding: 4px 16px;
  letter-spacing: .02em;
}

/* ---------- Boutons, segmentés, étiquettes : une seule famille ---------- */
.bouton {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e-8);
  min-height: 40px; padding: 0 var(--e-16); border-radius: var(--r-12);
  border: 1px solid var(--trait-fort); background: transparent; color: var(--encre);
  font-weight: 600; font-size: var(--t-15); text-decoration: none; cursor: pointer; white-space: nowrap;
}
.bouton:hover { background: var(--actif-fond); }
.bouton.principal { background: var(--encre); color: var(--fond); border-color: transparent; }
.bouton.principal:hover { background: var(--doux); }
.bouton.discret { border-color: transparent; }
.bouton.rond { width: 40px; padding: 0; border-radius: var(--r-rond); border-color: var(--trait); }
.bouton.petit { min-height: 32px; padding: 0 var(--e-12); font-size: var(--t-13); }

.seg { display: inline-flex; gap: var(--e-4); padding: 3px; border: 1px solid var(--trait); border-radius: var(--r-rond); background: var(--surface); max-width: 100%; }
.seg button, .seg a {
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 var(--e-12);
  border-radius: var(--r-rond); border: 1px solid transparent; background: none; color: var(--doux);
  font-weight: 600; font-size: var(--t-13); cursor: pointer; text-decoration: none; white-space: nowrap;
}
/* L'unique style « actif » de l'appli : fond éclairé + trait de projecteur */
.est-actif, .seg [aria-pressed="true"], [aria-current="page"] {
  background: var(--actif-fond) !important; color: var(--encre) !important; border-color: var(--actif-trait) !important;
}

.etiq { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: var(--r-6); font-size: var(--t-12); font-weight: 600; line-height: 20px; white-space: nowrap; background: var(--surface-3); color: var(--doux); }
.etiq.ok { background: var(--ok-doux); color: var(--ok); }
.etiq.attention { background: var(--attention-doux); color: var(--attention); }
.etiq.stop { background: var(--stop-doux); color: var(--stop); }
.etiq.etoiles { background: var(--etoile-doux); color: var(--etoile); }
.etiq.capitaine { background: var(--encre); color: var(--fond); }

.pastille { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--r-6); font: 700 var(--t-12)/1 var(--chiffres); flex: none; }
.pastille.V { background: var(--ok); color: var(--sur-plein); }
.pastille.D { background: var(--stop); color: var(--sur-plein); }
.pastille.N { background: var(--surface-3); color: var(--encre); box-shadow: inset 0 0 0 1px var(--trait-fort); }
.pastilles { display: inline-flex; gap: 3px; }

.surface { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-12); }

/* ---------- Ossature ---------- */
.appli { min-height: 100vh; display: block; }
.laterale { display: none; }
.barre-haut {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--e-8);
  height: 56px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--fond) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--trait);
}
.barre-haut .espace { flex: 1; }
.bouton-maj { min-height: 40px; padding: 0 var(--e-12); gap: 6px; font-size: var(--t-13); border-color: var(--trait); }
.bouton-maj .num { font-size: var(--t-15); }
.barre-bas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--trait);
}
.barre-bas a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: var(--t-12); font-weight: 600; color: var(--doux); text-decoration: none; border-radius: var(--r-12); border: 1px solid transparent; margin: 4px 2px; }
main { min-width: 0; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.contenu { padding: var(--e-16) max(16px, env(safe-area-inset-right, 0px)) var(--e-32) max(16px, env(safe-area-inset-left, 0px)); max-width: 760px; margin: 0 auto; }
.contenu > * + * { margin-top: var(--e-16); }

@media (min-width: 600px) {
  .contenu { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
}
@media (min-width: 1024px) {
  body { font-size: 16px; }
  .appli { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  .barre-haut, .barre-bas { display: none; }
  main { padding-bottom: 0; }
  .contenu { max-width: 1520px; padding: var(--e-24) 32px 48px; margin: 0; }
  .laterale {
    display: flex; flex-direction: column; gap: var(--e-16); position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: var(--e-16) var(--e-12) var(--e-12); background: var(--surface); border-right: 1px solid var(--trait);
  }
}
@media (min-width: 1440px) { .appli { grid-template-columns: 256px minmax(0, 1fr); } .contenu { padding: 28px 40px 56px; } }

/* barre latérale */
.marque { display: flex; align-items: center; gap: var(--e-8); padding: 4px 8px; font: 600 var(--t-18)/1 var(--chiffres); letter-spacing: .02em; }
.marque .logo { width: 28px; height: 28px; border-radius: var(--r-6); display: grid; place-items: center; background: var(--encre); color: var(--fond); }
.nav-lat { display: flex; flex-direction: column; gap: 2px; }
.nav-lat a, .nav-lat button {
  display: flex; align-items: center; gap: var(--e-12); min-height: 40px; padding: 0 var(--e-12); border-radius: var(--r-12);
  border: 1px solid transparent; color: var(--doux); text-decoration: none; font-weight: 600; font-size: var(--t-15); background: none; cursor: pointer; text-align: left;
}
.nav-lat a:hover { background: var(--actif-fond); color: var(--encre); }
.nav-lat .compte { margin-left: auto; font-size: var(--t-13); color: var(--tres-doux); }
.titre-lat { padding: 0 var(--e-12); }
.entrees-sport { display: grid; gap: var(--e-8); }
.entree-sport {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px var(--e-12);
  padding: var(--e-12); border-radius: var(--r-12); border: 1px solid var(--trait); background: var(--surface-2); cursor: pointer; text-align: left; position: relative; overflow: hidden;
}
.entree-sport .ic { width: 24px; height: 24px; }
.entree-sport[data-pour="football"] .ic { color: var(--foot); }
.entree-sport[data-pour="nba"] .ic { color: var(--nba); }
.entree-sport .nom { font-weight: 700; font-size: var(--t-15); }
.entree-sport .sous { grid-column: 2; font-size: var(--t-12); color: var(--doux); }
.entree-sport .chiffre { grid-row: 1 / span 2; grid-column: 3; font-size: var(--t-32); font-weight: 600; line-height: 1; text-align: right; }
.entree-sport .chiffre small { display: block; font: 600 var(--t-12)/1.2 var(--police); color: var(--doux); letter-spacing: 0; }
.entree-sport .fil { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--trait); overflow: hidden; margin-top: 4px; }
.entree-sport .fil i { display: block; height: 100%; border-radius: 2px; }
.entree-sport[data-pour="football"] .fil i { background: var(--foot); }
.entree-sport[data-pour="nba"] .fil i { background: var(--nba); }
.carte-etat { padding: var(--e-12); border-radius: var(--r-12); background: var(--attention-doux); display: grid; gap: var(--e-8); }
.carte-etat .titre { display: flex; align-items: center; gap: var(--e-8); font-weight: 700; font-size: var(--t-13); color: var(--attention); }
.carte-etat p { font-size: var(--t-13); }
.pied-lat { margin-top: auto; display: grid; gap: var(--e-8); padding-top: var(--e-12); border-top: 1px solid var(--trait); }
.pied-lat .ligne { display: flex; align-items: center; gap: var(--e-8); }
.pied-lat .age { font-size: var(--t-12); color: var(--doux); line-height: 1.3; }
.pied-lat .age b { color: var(--encre); font-weight: 600; }

/* ---------- Accueil : la scène ---------- */
.scene {
  position: relative; overflow: hidden; isolation: isolate;
  min-height: 600px; color: var(--scene-encre);
  background:
    radial-gradient(ellipse 34% 70% at 72% -8%, rgba(225, 235, 255, .20), transparent 70%),
    radial-gradient(ellipse 22% 50% at 92% -5%, rgba(225, 235, 255, .10), transparent 70%),
    radial-gradient(ellipse 60% 30% at 70% 100%, color-mix(in srgb, var(--scene-sport) 22%, transparent), transparent 75%),
    linear-gradient(180deg, var(--scene-haut), var(--scene-bas));
  --scene-sport: var(--scene-foot);
}
:root[data-sport="nba"] .scene { --scene-sport: var(--scene-nba); }
.scene-3d { position: absolute; inset: 0; z-index: -1; }
.scene-3d canvas { display: block; width: 100% !important; height: 100% !important; }
.scene::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, transparent 30%, color-mix(in srgb, var(--scene-haut) 80%, transparent) 70%, var(--scene-haut) 100%); }
.scene-contenu {
  position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 600px;
  padding: 220px max(16px, env(safe-area-inset-right, 0px)) var(--e-24) max(16px, env(safe-area-inset-left, 0px));
}
.scene .surtitre { display: flex; align-items: center; gap: var(--e-8); font-size: var(--t-13); font-weight: 600; color: var(--scene-doux); letter-spacing: .04em; text-transform: uppercase; }
.scene .surtitre .ic { color: var(--scene-sport); }
.hero-chiffre { font: 600 var(--t-hero)/.9 var(--chiffres); font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin-top: var(--e-8);
  text-shadow: 0 0 28px color-mix(in srgb, var(--scene-sport) 45%, transparent); }
.hero-chiffre .pct { font-size: .45em; margin-left: .08em; color: var(--scene-doux); }
.hero-texte { font-size: var(--t-18); max-width: 30ch; margin-top: var(--e-8); }
.hero-texte b { font-family: var(--chiffres); font-size: var(--t-24); font-weight: 600; }
.hero-equipe { margin-top: var(--e-8); font-size: var(--t-13); color: var(--scene-doux); max-width: 46ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: var(--e-8); margin-top: var(--e-16); }
.scene .bouton { color: var(--scene-encre); border-color: rgba(243, 246, 251, .35); }
.scene .bouton:hover { background: rgba(243, 246, 251, .1); }
.scene .bouton.principal { background: var(--scene-encre); color: #0b111b; border-color: transparent; }
.scene .etiq.attention { background: rgba(242, 194, 91, .18); color: #f2c25b; }

.jalons { list-style: none; margin: var(--e-24) 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); max-width: 520px; position: relative; }
.jalons::before { content: ""; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 11px; height: 2px; background: rgba(243, 246, 251, .18); }
.jalons .avance { position: absolute; left: calc(100% / 12); top: 11px; height: 2px; background: var(--j-couleur, var(--scene-sport)); }
.jalons li { position: relative; display: grid; justify-items: center; gap: 4px; font-size: var(--t-12); color: var(--scene-doux); text-align: center; }
.jalons .point { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--scene-haut); border: 2px solid rgba(243, 246, 251, .28); font: 600 var(--t-12)/1 var(--chiffres); }
.jalons .passe .point { background: var(--j-couleur, var(--scene-sport)); border-color: transparent; color: #0b111b; }
.jalons .encours .point { border-color: var(--j-couleur, var(--scene-sport)); color: var(--scene-encre); box-shadow: 0 0 0 4px color-mix(in srgb, var(--j-couleur, var(--scene-sport)) 30%, transparent), 0 0 18px var(--j-couleur, var(--scene-sport)); }
.jalons .encours { color: var(--scene-encre); font-weight: 600; }
.jalons .cible { font: 600 var(--t-15)/1 var(--chiffres); }

@media (min-width: 700px) {
  .scene, .scene-contenu { min-height: 560px; }
  .scene-contenu { padding: 48px 40px 32px; max-width: 760px; }
  .scene::after { background: linear-gradient(90deg, color-mix(in srgb, var(--scene-haut) 85%, transparent) 0%, color-mix(in srgb, var(--scene-haut) 40%, transparent) 45%, transparent 70%); }
}
@media (min-width: 1024px) { .scene, .scene-contenu { min-height: min(68vh, 640px); } .scene-contenu { padding: 56px 48px 40px; } }

/* repli sans WebGL ou mouvement réduit : faisceaux en dégradé CSS */

    conic-gradient(from 168deg at 72% -10%, transparent 0deg, rgba(225, 235, 255, .16) 8deg, transparent 16deg, transparent 26deg, rgba(225, 235, 255, .10) 30deg, transparent 36deg),
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255, 255, 255, .025) 46px 47px);
}

.sports-accueil { display: grid; gap: var(--e-16); }
@media (min-width: 900px) { .sports-accueil { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.carte-sport { padding: var(--e-16); display: grid; gap: var(--e-12); }
.carte-sport.est-courant { border-color: var(--actif-trait); }
.carte-sport header { display: flex; align-items: center; gap: var(--e-8); }
.carte-sport header .ic { width: 24px; height: 24px; }
.carte-sport[data-pour="football"] header .ic { color: var(--foot); }

.carte-sport header h2 { flex: 1; }

<script>
(function () {

  });
});
function prop(s) { return D.propositions[s]; }
function palier(s) { return D.paliers.filter(function (p) { return p.sport === s; })[0]; }
function estCapitaine(s, j) { var c = prop(s).capitaine; return !!c && j.carteId.indexOf(c + '-') === 0; }
function dansProp(s, j) { return prop(s).joueurs.some(function (x) { return x.carteId === j.carteId; }); }
etat.joueur.football = prop('football').joueurs[3].carteId;
etat.joueur.nba = prop('nba').joueurs[0].carteId;

function rolesFoot(p) {
  var pris = {}, roles = {};
  p.joueurs.forEach(function (j) { var po = j.postes[0]; if (!pris[po]) { pris[po] = 1; roles[j.carteId] = po; } });
  p.joueurs.forEach(function (j) { if (!roles[j.carteId]) roles[j.carteId] = 'EX'; });
  return roles;
}
function ordreProp(s) {
  var p = prop(s);
  if (s !== 'football') return p.joueurs.slice();
  var r = rolesFoot(p), ordre = ['GK', 'DF', 'MD', 'FW', 'EX'];
  return p.joueurs.slice().sort(function (a, b) { return ordre.indexOf(r[a.carteId]) - ordre.indexOf(r[b.carteId]); });
}
function role(j) {
  if (j.sport === 'football' && dansProp('football', j)) {
    var r = rolesFoot(prop('football'))[j.carteId];
    return r === 'EX' ? 'EX · ' + j.postes[0] : r;
  }
  return j.postes.join('/');
}
function joues(j) { return j.historique15.filter(function (h) { return h.situation !== 'banc' && h.situation !== 'absent' && h.score != null; }); }
function quantile(arr, q) { var a = arr.slice().sort(function (x, y) { return x - y; }); if (!a.length) return 0; var i = (a.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return a[lo] + (a[hi] - a[lo]) * (i - lo); }
function fourchette(j) {
  var m = 1 + j.bonusPct / 100;
  var sc = joues(j).map(function (h) { return h.score * m; });
  return { q10: quantile(sc, 0.1), q90: quantile(sc, 0.9), n: sc.length };
}
function verrouillage(s) {
  var t = prop(s).joueurs.map(function (j) { return j.match.coupEnvoiUTC; }).sort()[0];
  return t;
}
function etatPalier(s) {
  var p = palier(s), utilisees = 4 - p.tentativesRestantes;

  var bloquees = utilisees * 5;
  var marquees = Object.keys(etat.marquees).filter(function (k) { return etat.marquees[k] && parId[k] && parId[k].sport === s; }).length;
  var titre = (enCours && p.tentativesRestantes === 0) ? 'Dernière tentative en cours' : (enCours ? 'Tentative en cours' : 'Palier ouvert');
  var detail = p.echecs + ' échec' + (p.echecs > 1 ? 's' : '') + (enCours ? ' · 1 en cours' : '') + ' · ' + p.tentativesRestantes + ' restante' + (p.tentativesRestantes > 1 ? 's' : '');
  return { titre: titre, detail: detail, bloquees: bloquees, marquees: marquees };
}

/* ---------- simulation de la maquette (5 000 tirages) ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var SIM = {};
function simuler(s) {
  if (SIM[s]) return SIM[s];
  var p = prop(s), rng = mulberry32(20261107 + (s === 'nba' ? 1 : 0)), N = 5000;
  var js = p.joueurs.map(function (j) {
    var b = 1 + j.bonusPct / 100, sc = joues(j).map(function (h) { return h.score; });
    var moy = sc.reduce(function (a, v) { return a + v; }, 0) / (sc.length || 1), cible = j.scoreSiJoue / b;
    return { p: j.chancesDeJouer, sc: sc.map(function (v) { return Math.max(0, v - moy + cible); }), m: b + (estCapitaine(s, j) ? 0.5 : 0) };
  });
  var tot = new Float64Array(N), passe = 0, somme = 0, mn = Infinity, mx = -Infinity;
  for (var i = 0; i < N; i++) {

  var classes = new Array(nb).fill(0);
  for (i = 0; i < N; i++) classes[Math.min(nb - 1, Math.floor((tot[i] - debut) / pas))]++;
  SIM[s] = { classes: classes, debut: debut, pas: pas, pPasse: passe / N, moyenne: somme / N, cible: p.cible, n: N };
  return SIM[s];
}

/* ---------- petits graphiques (SVG en chaîne, couleurs en jetons) ---------- */
function barreJouer(p, largeur) {

}

function jauge(p) {
  var R = 90, cx = 110, cy = 104, a0 = Math.PI, a1 = Math.PI + Math.PI * p;
  function pt(a, r) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  var d0 = pt(a0, R), d1 = pt(2 * Math.PI, R), e1 = pt(a1, R);
  var ticks = '';
  for (var k = 0; k <= 10; k++) {
    var a = Math.PI + Math.PI * k / 10, i1 = pt(a, R - 12), i2 = pt(a, R - (k % 5 ? 16 : 20));
    ticks += '<line x1="' + i1[0].toFixed(1) + '" y1="' + i1[1].toFixed(1) + '" x2="' + i2[0].toFixed(1) + '" y2="' + i2[1].toFixed(1) + '" stroke="var(--trait-fort)" stroke-width="1"/>';
  }
  return '<svg viewBox="0 0 220 116" role="img" aria-label="Chances de passer ' + pc(p) + '">' +
    '<path d="M' + d0[0] + ' ' + d0[1] + ' A' + R + ' ' + R + ' 0 0 1 ' + d1[0] + ' ' + d1[1] + '" fill="none" stroke="var(--trait)" stroke-width="8" stroke-linecap="round"/>' +
    '<path class="lueur" d="M' + d0[0] + ' ' + d0[1] + ' A' + R + ' ' + R + ' 0 0 1 ' + e1[0].toFixed(2) + ' ' + e1[1].toFixed(2) + '" fill="none" stroke="var(--sport)" stroke-width="8" stroke-linecap="round"/>' +
    ticks + '</svg>';
}

/* graphiques qui dépendent de la largeur : remplis après insertion */
function remplirGraphes(racine) {
  (racine || document).querySelectorAll('[data-graphe]').forEach(function (el) {
    var w = Math.floor(el.clientWidth);
    if (!w) return;
    var g = el.getAttribute('data-graphe');
    if (g === 'distribution') el.innerHTML = grapheDistribution(el.getAttribute('data-sport'), w, +el.getAttribute('data-h') || 150, el.hasAttribute('data-mini'));
    if (g === 'historique') el.innerHTML = grapheHistorique(parId[el.getAttribute('data-joueur')], w);
  });
}

function grapheDistribution(s, W, H, mini) {
  var sim = simuler(s), n = sim.classes.length;
  var ml = 4, mr = 4, mt = mini ? 18 : 22, mb = mini ? 6 : 22;
  var iw = W - ml - mr, ih = H - mt - mb;
  var lo = sim.debut, hi = sim.debut + n * sim.pas;
  function x(v) { return ml + (v - lo) / (hi - lo) * iw; }
  var max = Math.max.apply(null, sim.classes);
  var bw = iw / n, out = '';
  var dessous = '', dessus = '';
  sim.classes.forEach(function (c, i) {
    if (!c) return;
    var h = Math.max(1, c / max * ih), v0 = lo + i * sim.pas;
    var r = '<rect x="' + (ml + i * bw + 0.75).toFixed(1) + '" y="' + (mt + ih - h).toFixed(1) + '" width="' + Math.max(1, bw - 1.5).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1"/>';
    if (v0 >= sim.cible) dessus += r; else dessous += r;
  });
  out += '<g fill="var(--trait-fort)" opacity=".75">' + dessous + '</g>';
  out += '<g class="lueur" fill="var(--sport)">' + dessus + '</g>';
  out += '<line x1="' + ml + '" y1="' + (mt + ih + 0.5) + '" x2="' + (W - mr) + '" y2="' + (mt + ih + 0.5) + '" stroke="var(--trait-fort)"/>';
  var xc = x(sim.cible);
  out += '<line x1="' + xc.toFixed(1) + '" y1="' + (mt - 4) + '" x2="' + xc.toFixed(1) + '" y2="' + (mt + ih + 4) + '" stroke="var(--projo)" stroke-width="1.5"/>';
  var anc = xc > W - 70 ? 'end' : (xc < 70 ? 'start' : 'middle');
  out += '<text class="fort" x="' + xc.toFixed(1) + '" y="' + (mt - 8) + '" text-anchor="' + anc + '">cible ' + nf(sim.cible) + '</text>';
  if (!mini) {
    var pasAxe = s === 'nba' ? 30 : 50;
    for (var v = Math.ceil(lo / pasAxe) * pasAxe; v <= hi; v += pasAxe) {
      if (Math.abs(v - sim.cible) < pasAxe * 0.45) continue;
      out += '<text x="' + x(v).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + v + '</text>';
    }
    var xm = x(sim.moyenne);
    out += '<path d="M' + xm.toFixed(1) + ' ' + (mt + ih + 2) + 'l-4 7h8z" fill="var(--doux)"/>';
  }
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Distribution simulée du score de l\'équipe : ' + pc(sim.pPasse) + ' des tirages atteignent la cible ' + sim.cible + '">' + out + '</svg>';
}

function grapheHistorique(j, W) {
  var S = SPORTS[j.sport], H = 210, ml = 26, mr = 8, mt = 18, mb = 26;
  var iw = W - ml - mr, ih = H - mt - mb, e = S.echelle;
  var h15 = j.historique15, n = h15.length;
  // espacement proportionnel aux dates, longues pauses plafonnées
  var pos = [0];
  for (var i = 1; i < n; i++) {
    var jours = (new Date(h15[i].date) - new Date(h15[i - 1].date)) / 864e5;
    pos.push(pos[i - 1] + Math.max(2, Math.min(jours, 9)));
  }
  var total = pos[n - 1] || 1;
  var slot = Math.min(26, iw / n * 0.72);
  function x(i) { return ml + slot / 2 + pos[i] / total * (iw - slot); }
  function y(v) { return mt + ih - Math.min(v, e) / e * ih; }
  var uid = 'h' + Math.random().toString(36).slice(2, 8), out = '';
  out += '<defs><pattern id="' + uid + 'a" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)"><rect width="1.6" height="4" fill="var(--hist-plein)"/></pattern>' +
    '<pattern id="' + uid + 'b" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)"><rect width="1.6" height="4" fill="var(--sport)"/></pattern></defs>';
  for (var g = S.pas; g < e; g += S.pas) {
    out += '<line x1="' + ml + '" y1="' + y(g) + '" x2="' + (W - mr) + '" y2="' + y(g) + '" stroke="var(--trait)" stroke-dasharray="2 3"/>';
    out += '<text x="' + (ml - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end">' + g + '</text>';
  }
  var f = fourchette(j), m = 1 + j.bonusPct / 100;
  out += '<rect x="' + ml + '" y="' + y(f.q90 / m).toFixed(1) + '" width="' + iw + '" height="' + (y(f.q10 / m) - y(f.q90 / m)).toFixed(1) + '" fill="var(--projo)" opacity=".06"/>';
  // pauses
  for (i = 1; i < n; i++) {
    var dj = (new Date(h15[i].date) - new Date(h15[i - 1].date)) / 864e5;
    if (dj > 25) { var xs = (x(i) + x(i - 1)) / 2; out += '<line x1="' + xs.toFixed(1) + '" y1="' + mt + '" x2="' + xs.toFixed(1) + '" y2="' + (mt + ih) + '" stroke="var(--trait-fort)" stroke-dasharray="1 3"/>'; }
  }
  var dernier3 = n - 3;
  h15.forEach(function (h, i) {
    var cx = x(i), x0 = (cx - slot / 2).toFixed(1), joue = h.situation !== 'banc' && h.situation !== 'absent';
    var recent = i >= dernier3;
    var t = h.date.split('-').reverse().join('/') + ' · ' + h.situation + (joue ? ' · ' + h.score + ' pts' + (h.minutes ? ' · ' + h.minutes + ' min' : '') : '');
    if (!joue) {
      out += '<g><title>' + esc(t) + '</title><rect x="' + x0 + '" y="' + mt + '" width="' + slot.toFixed(1) + '" height="' + ih + '" rx="3" fill="none" stroke="var(--stop)" stroke-dasharray="3 3"/>' +
        '<text x="' + cx.toFixed(1) + '" y="' + (mt + ih - 6) + '" text-anchor="middle" style="fill:var(--stop);font-weight:600">' + (h.situation === 'banc' ? 'B' : 'A') + '</text></g>';
      return;
    }
    var yy = y(h.score), hh = Math.max(1.5, mt + ih - yy);
    var plein = recent ? 'var(--sport)' : 'var(--hist-plein)';
    var entre = h.situation === 'entre';
    out += '<g' + (recent ? ' class="lueur"' : '') + '><title>' + esc(t) + '</title><rect x="' + x0 + '" y="' + yy.toFixed(1) + '" width="' + slot.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="2" fill="' + (entre ? 'url(#' + uid + (recent ? 'b' : 'a') + ')' : plein) + '" stroke="' + plein + '" stroke-width="' + (entre ? 1.2 : 0) + '"/></g>';
    out += '<text x="' + cx.toFixed(1) + '" y="' + (yy - 4).toFixed(1) + '" text-anchor="middle"' + (recent ? ' class="fort"' : '') + '>' + h.score + '</text>';
  });
  // moyennes : 15 matchs (pointillé) et 3 derniers (trait de la couleur du sport)
  var m15 = j.formeJoueur.moyenne15, m3 = j.formeJoueur.moyenne3;
  out += '<line x1="' + ml + '" y1="' + y(m15).toFixed(1) + '" x2="' + (W - mr) + '" y2="' + y(m15).toFixed(1) + '" stroke="var(--projo)" stroke-width="1.2" stroke-dasharray="6 4" opacity=".8"/>';
  var xa = x(dernier3) - slot / 2 - 4, xb = W - mr;
  out += '<line x1="' + xa.toFixed(1) + '" y1="' + y(m3).toFixed(1) + '" x2="' + xb + '" y2="' + y(m3).toFixed(1) + '" stroke="var(--sport)" stroke-width="2.5"/>';
  // mois
  var dejaMois = '';
  h15.forEach(function (h, i) {
    var mo = h.date.slice(0, 7);
    if (mo !== dejaMois) { dejaMois = mo; out += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + F_MOIS.format(new Date(h.date + 'T12:00:00Z')) + '</text>'; }
  });
  out += '<line x1="' + ml + '" y1="' + (mt + ih + 0.5) + '" x2="' + (W - mr) + '" y2="' + (mt + ih + 0.5) + '" stroke="var(--trait-fort)"/>';
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Historique des ' + n + ' derniers matchs de ' + esc(j.nom) + '">' + out + '</svg>';
}

function etiquettes(j, complet) {
  var t = '';

    t += '<span class="etiq ' + c + '">' + esc(j.statut) + '</span>';

  if (j.chancesDeJouer < etat.seuil) t += '<span class="etiq attention">Sous le seuil de ' + pc(etat.seuil) + '</span>';
  return t;
}

    '<span class="lj-sijoue-col"><span class="num">' + nf(j.scoreSiJoue) + '</span>' + intervalle(j, 80) + '</span>' +

      '<span class="lj-sijoue">s\'il joue <span class="num">' + nf(j.scoreSiJoue) + '</span></span></span>' +

function vueAccueil() {

      : '<div class="cc"><span class="libelle">Capitaine</span><span class="valeur num" style="font-size:var(--t-24)">' + esc(prenomNom((ordre.filter(function (j) { return estCapitaine(s, j); })[0] || {}).nom || '—')) + '</span><span class="note">score × 1,5</span></div>') +

  // contribution
  var tot = 0, parts = ordre.map(function (j) { var v = j.esperance * (estCapitaine(s, j) ? 1.5 : 1); tot += v; return { j: j, v: v }; });
  var echelle = Math.max(tot, p.cible) * 1.04;
  h += '<div class="contribution"><span class="libelle">Qui porte l\'équipe · espérance par joueur</span><div class="barre" style="margin-top:14px">' +
    parts.map(function (x) { return '<span class="' + (estCapitaine(s, x.j) ? 'cap' : '') + '" style="width:' + (x.v / echelle * 100).toFixed(2) + '%" title="' + esc(x.j.nom) + ' ' + nf(x.v, 1) + '">' + esc(prenomNom(x.j.nom).slice(0, 10)) + '</span>'; }).join('') +
    '<i class="repere" style="left:' + (p.cible / echelle * 100).toFixed(2) + '%"><em>cible ' + p.cible + '</em></i></div></div>';
  h += '<ul class="liste">' + enteteListe() + ordre.map(function (j) { return ligneJoueur(j, { capitaine: estCapitaine(s, j), role: s === 'football' ? (roles[j.carteId] === 'EX' ? 'EX · ' + j.postes[0] : roles[j.carteId]) : j.postes.join('/') }); }).join('') + '</ul>';
  h += '<div class="actions"><button class="bouton principal" type="button" data-action="joue">' + ic('i-cartes', 'ic-16') + 'J\'ai joué cette équipe</button><span class="petit doux">Marque les 5 cartes · annulable 8 s</span></div>';
  h += '</section>';
  // autres propositions
  h += '<section class="surface autres"><h2>Autres propositions</h2>' +
    '<details class="repli"><summary>' + ic('i-fleche', 'ic-16') + 'Équilibrée<span style="margin-left:auto" class="num">' + pc(p.equilibree.chancesDePasser) + '</span></summary><p class="petit doux">Détail non inclus dans les données de la maquette.</p></details>' +
    '<details class="repli"><summary>' + ic('i-fleche', 'ic-16') + 'Ambitieuse (seuil 60' + NB + '%)<span style="margin-left:auto" class="num">' + (p.ambitieuse ? pc(p.ambitieuse.chancesDePasser) : '—') + '</span></summary><p class="petit doux">' + (p.ambitieuse ? 'Détail non inclus dans les données de la maquette.' : 'Ne fait pas mieux que la prudente : non proposée.') + '</p></details>' +
    '<details class="repli"><summary>' + ic('i-fleche', 'ic-16') + 'Créneau unique<span style="margin-left:auto" class="petit doux">après les compos (vers H−1 h)</span></summary><p class="petit doux">Esquisse : liste des coups d\'envoi à gauche, équipe du créneau à droite.</p></details>' +
    '</section>';

        '<img src="' + c.vignette + '" alt="" loading="lazy"><span class="qui"><b>' + esc(c.nom) + ' ' + badgeEtoiles(c) + '</b><span>' + c.postes.join('/') + ' · à la place de ' + esc(prenomNom(rempl.nom)) + ' · joue ' + pc(c.chancesDeJouer) + '</span></span>' +
        '<span class="delta"><span class="num">' + (d >= 0 ? '+' : '−') + nf(Math.abs(d), 1) + '</span>pts d\'espérance</span></button>';

  h += '</div></div>';

}
function casesEtoiles(ordre) {
  var cases = new Array(16).fill(0), k = 0;
  ordre.forEach(function (j) { var r = j.etoiles; while (r > 0 && k < 16) { var part = Math.min(1, r); cases[k] += part; r -= part; if (cases[k] >= 1) k++; } });
  return '<span class="cases-etoiles" role="img" aria-label="Étoiles utilisées">' + cases.map(function (c) { return '<i><b style="width:' + (c * 100) + '%"></b></i>'; }).join('') + '</span>';
}

function ficheContenu(j, compacte) {

    '<div class="cc"><span class="libelle">Espérance</span><span class="valeur num">' + nf(j.esperance, 1) + '</span><span class="note">chances × score' + (j.bonusPct ? ', bonus ' + j.bonusPct + NB + '% compris' : '') + '</span></div>' +
    '<div class="cc"><span class="libelle">Victoire</span>' + (m.victoirePct != null

function blocForme(titre, nom, fc) {

    l.map(function (j) {

        '<td class="droite col-opt num">' + (j.match.victoirePct != null ? j.match.victoirePct + NB + '%' : '<span class="doux">—</span>') + '</td>' +
        '<td class="droite"><span class="num"' + (sous ? ' style="color:var(--attention)"' : '') + '>' + pc(j.chancesDeJouer) + '</span><div style="display:flex;justify-content:flex-end">' + barreJouer(j.chancesDeJouer, 64) + '</div></td>' +
        '<td class="droite"><span class="num">' + nf(j.scoreSiJoue) + '</span><div style="display:flex;justify-content:flex-end">' + intervalle(j, 64) + '</div></td>' +

        '<td><input type="checkbox" aria-label="Jouée au palier" data-marque="' + esc(j.carteId) + '"' + (etat.marquees[j.carteId] ? ' checked' : '') + '></td></tr>';
    }).join('') + '</tbody></table></div>';

function vueSquad() {

/* ---------- navigation ---------- */
function route(v, s) { s = s || etat.sport; return v + (s === 'nba' ? '-nba' : ''); }
function lireRoute() {
  var h = (location.hash || '#accueil').slice(1);

}

  var age = Math.round((MAINTENANT - RECUP) / 60000);

  document.getElementById('age-haut').textContent = age + ' min';

    return '<button type="button" data-sport-vers="' + x + '" aria-pressed="' + (x === s) + '" style="' + (x === s ? 'color:var(--' + (x === 'football' ? 'foot' : 'nba') + ')' : '') + '">' + ic(SPORTS[x].icone, 'ic-16').replace('class="ic', 'style="color:var(--' + (x === 'football' ? 'foot' : 'nba') + ')" class="ic') + SPORTS[x].court + '</button>';
  }).join('');
  document.getElementById('barre-bas').innerHTML = [['accueil', 'Accueil', 'i-maison'], ['solo', 'Solo', 'i-solo'], ['squad', 'Squad', 'i-squad'], ['cartes', 'Cartes', 'i-cartes']].map(function (m) {
    var cur = etat.vue === m[0] || (m[0] === 'solo' && etat.vue === 'fiche');

  }).join('');

  document.querySelectorAll('[data-action="theme"] use').forEach(function (u) { u.setAttribute('href', sombre ? '#i-soleil' : '#i-lune'); });
}
var vueAvant = null;
function afficher() {
  var r = lireRoute();
  etat.vue = r.vue; etat.sport = r.sport;
  majChrome();
  var main = document.getElementById('vue');
  var html = { accueil: vueAccueil, solo: vueSolo, squad: vueSquad, cartes: vueCartes, fiche: vueFiche }[etat.vue]();
  main.innerHTML = html;
  remplirGraphes(main);
  if (vueAvant !== null) window.scrollTo(0, 0);
  vueAvant = etat.vue;
  if (etat.vue === 'accueil') Scene.monter(document.getElementById('scene-3d'), document.getElementById('scene'), etat.sport);
  else Scene.arreter();
  document.title = 'Sorare aide · Nocturne';
}

/* ---------- interactions ---------- */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-sport-vers],[data-joueur],[data-seuil],[data-poste],[data-tri],[data-action],[data-marque]');

    } else if (a === 'aide') {

});
document.addEventListener('keydown', function (ev) {

});
var zoneToast = document.getElementById('toast-zone'), minuteur = null;
function toast(msg, annuler) {

  if (annuler) document.getElementById('toast-annuler').onclick = function () { annuler(); zoneToast.innerHTML = ''; };
  minuteur = setTimeout(function () { zoneToast.innerHTML = ''; }, 8000);
}
var rt = null;
window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { remplirGraphes(document); }, 120); });
window.addEventListener('hashchange', afficher);
try { var th = localStorage.getItem('nocturne-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}

/* ---------- la scène three.js (accueil) ---------- */
var Scene = (function () {

  }
  function texRonde() {

    var g = c.getContext('2d'), d = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    d.addColorStop(0, 'rgba(255,255,255,1)'); d.addColorStop(0.35, 'rgba(255,255,255,.45)'); d.addColorStop(1, 'rgba(255,255,255,0)');

  function construire() {

    spot = new T.SpotLight(0xe6eeff, 3.2, 30, 0.32, 0.65, 1.2);
    // pelouse / parquet
    var sol = new T.Mesh(new T.PlaneGeometry(60, 40), new T.MeshStandardMaterial({ color: 0x0a0f18, roughness: 1, metalness: 0 }));
    sol.rotation.x = -Math.PI / 2; scene.add(sol);
    groupe = new T.Group(); scene.add(groupe); groupe.add(spot); groupe.add(spot.target);

      var h = 0.35 + i * 0.34;

      var bords = new T.LineSegments(new T.EdgesGeometry(geo), new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 }));

    }
    // faisceau du projecteur (cône additif, plus lumineux près de la lampe)
    var hc = 7.5;
    var coneGeo = new T.ConeGeometry(1.15, hc, 48, 1, true);
    var coneMat = new T.ShaderMaterial({
      uniforms: { uCouleur: { value: new T.Color(0xdfe9ff) }, uOpacite: { value: 0.22 } },
      vertexShader: 'varying float vH; varying vec3 vN; varying vec3 vV; void main(){ vH = position.y / ' + hc.toFixed(1) + ' + 0.5; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'uniform vec3 uCouleur; uniform float uOpacite; varying float vH; varying vec3 vN; varying vec3 vV; void main(){ float f = abs(dot(vN, vV)); float a = uOpacite * pow(f, 1.6) * (0.25 + 0.75 * vH); gl_FragColor = vec4(uCouleur, a); }',
      transparent: true, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide
    });
    faisceau = new T.Mesh(coneGeo, coneMat); faisceau.userData.h = hc; groupe.add(faisceau);
    var tex = texRonde();
    halo = new T.Sprite(new T.SpriteMaterial({ map: tex, color: 0xeef3ff, transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false }));
    halo.scale.set(1.6, 1.6, 1); groupe.add(halo);
    piscine = new T.Mesh(new T.PlaneGeometry(3.2, 3.2), new T.MeshBasicMaterial({ map: tex, color: 0x9fb4d8, transparent: true, opacity: 0.35, blending: T.AdditiveBlending, depthWrite: false }));
    piscine.rotation.x = -Math.PI / 2; groupe.add(piscine);
    // projecteurs du stade, au loin
    [[-9, 7.5, -9], [-4, 8.2, -11], [4, 8.2, -11], [9, 7.5, -9]].forEach(function (p) {
      var s = new T.Sprite(new T.SpriteMaterial({ map: tex, color: 0xdfe8ff, transparent: true, opacity: 0.8, blending: T.AdditiveBlending, depthWrite: false }));
      s.position.set(p[0], p[1], p[2]); s.scale.set(1.3, 1.3, 1); scene.add(s); lampes.push(s);
    });
    // brume de particules
    var N = window.innerWidth < 700 ? 260 : 520, pos = new Float32Array(N * 3);
    for (var k = 0; k < N; k++) { pos[k * 3] = (Math.random() - 0.5) * 22; pos[k * 3 + 1] = Math.random() * 7; pos[k * 3 + 2] = (Math.random() - 0.7) * 14; }
    var pg = new T.BufferGeometry(); pg.setAttribute('position', new T.BufferAttribute(pos, 3));

  }
  function lignesTerrain(sport, couleur) {
    var T = THREE, pts = [];
    function seg(a, b, c, d) { pts.push(a, 0.01, b, c, 0.01, d); }
    function rect(x0, z0, x1, z1) { seg(x0, z0, x1, z0); seg(x1, z0, x1, z1); seg(x1, z1, x0, z1); seg(x0, z1, x0, z0); }
    function arc(cx, cz, r, a0, a1) { var n = 40; for (var i = 0; i < n; i++) { var u = a0 + (a1 - a0) * i / n, v = a0 + (a1 - a0) * (i + 1) / n; seg(cx + r * Math.cos(u), cz + r * Math.sin(u), cx + r * Math.cos(v), cz + r * Math.sin(v)); } }
    if (sport === 'nba') {
      rect(-7, -4, 7, 3.5); seg(0, -4, 0, 3.5); arc(0, -0.25, 0.9, 0, Math.PI * 2);
      rect(-7, -1.2, -4.6, 0.7); rect(4.6, -1.2, 7, 0.7);
      arc(-6.4, -0.25, 3.2, -Math.PI / 2, Math.PI / 2); arc(6.4, -0.25, 3.2, Math.PI / 2, Math.PI * 1.5);
    } else {
      rect(-8, -5, 8, 4); seg(0, -5, 0, 4); arc(0, -0.5, 1.4, 0, Math.PI * 2);
      rect(-8, -2.6, -5.9, 1.6); rect(5.9, -2.6, 8, 1.6); rect(-8, -1.4, -7.2, 0.4); rect(7.2, -1.4, 8, 0.4);
      for (var z = -5; z < 4; z += 1.8) { /* bandes de tonte */ }

  }
  function appliquerSport(s) {
    var T = THREE, pa = palier(s), acc = new T.Color(css(s === 'football' ? '--scene-foot' : '--scene-nba') || '#57d6db');
    sportCourant = s;
    if (lignes) { scene.remove(lignes); lignes.geometry.dispose(); lignes.material.dispose(); }
    lignes = lignesTerrain(s, acc); scene.add(lignes);
    marches.forEach(function (m, i) {
      var niv = i + 1;
      if (niv < pa.niveau) { m.mesh.material.emissive = acc.clone().multiplyScalar(0.18); m.bords.material.color = acc; m.bords.material.opacity = 0.55; }
      else if (niv === pa.niveau) { m.mesh.material.emissive = acc.clone().multiplyScalar(0.45); m.bords.material.color = new T.Color(0xffffff); m.bords.material.opacity = 0.95; }
      else { m.mesh.material.emissive = new T.Color(0x000000); m.bords.material.color = new T.Color(0xffffff); m.bords.material.opacity = 0.16; }
    });
    var cur = marches[pa.niveau - 1], p = cur.mesh.position, haut = cur.h;
    var hc = faisceau.userData.h;
    faisceau.position.set(p.x, haut + hc / 2, p.z);
    halo.position.set(p.x, haut + hc + 0.05, p.z);
    piscine.position.set(p.x, haut + 0.012, p.z);
    piscine.position.y = haut + 0.012;
    spot.position.set(p.x, haut + hc + 1, p.z);
    spot.target.position.set(p.x, haut, p.z);

  function theme() {

    var f = new THREE.Color(css('--scene-haut') || '#04060a');

    appliquerSport(sportCourant || etat.sport);
    rendre(performance.now());
  }
  function cadrer() {

    var etroit = camera.aspect < 1.1;

    else { groupe.scale.setScalar(1); groupe.position.set(Math.min(3, (camera.aspect - 1) * 2.4), 0, 0); camera.position.set(0, 3.4, 10.5); camera.lookAt(0, 1.3, -1); }

    monter: function (el, sec, sport) {

        sportCourant = sport;

afficher();
})();
