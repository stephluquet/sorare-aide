<title>Sorare aide · Salle d'analyse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Jetons ===== */
:root {
  color-scheme: light;
  --f-texte: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-titre: "Schibsted Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  /* 6 tailles + 1 chiffre héros */
  --t1: 12px; --t2: 13px; --t3: 15px; --t4: 18px; --t5: 24px; --t6: 32px; --t-hero: 56px;
  /* 3 rayons */
  --r1: 4px; --r2: 8px; --rp: 999px;
  /* grille de 4 */
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px;

  --fond: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --trait: #dde2e8; --trait-fort: #b3bcc6;
  --encre: #121820; --doux: #55606d; --faible: #7d8895; --sur-encre: #ffffff;
  --foot: #0b6b80; --nba: #b0335d;
  --ok: #15703f; --ok-doux: #e1f1e7; --attention: #8a5000; --attention-doux: #fbefdc;
  --stop: #b3261e; --stop-doux: #f9e3e1; --or: #8f6c00; --or-doux: #f5ecd0;
  --d-tit: #2f4a6b; --d-ent: #a9bdd6; --d-neutre: #c6ced8; --d-bande: #e7edf4;
  --v: #1d7a48; --n: #6b7682; --d: #b3261e; --sur-plein: #ffffff;
  --ombre: 0 1px 2px rgb(16 24 32 / .06), 0 12px 32px rgb(16 24 32 / .12);
  --sport: var(--foot);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: #0d1115; --surface: #151a20; --surface-2: #1b2128; --trait: #29313a; --trait-fort: #46515d;
    --encre: #e7ebef; --doux: #a1acb8; --faible: #7d8895; --sur-encre: #0d1115;
    --foot: #4db2c7; --nba: #e6799d;
    --ok: #63c48f; --ok-doux: #15291e; --attention: #e7a94c; --attention-doux: #2d2213;
    --stop: #f07f75; --stop-doux: #321a19; --or: #e5c25a; --or-doux: #2c2612;
    --d-tit: #8fb3dc; --d-ent: #3c5574; --d-neutre: #3a434d; --d-bande: #1f2a36;
    --v: #63c48f; --n: #a1acb8; --d: #f07f75; --sur-plein: #0d1115;
    --ombre: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fond: #0d1115; --surface: #151a20; --surface-2: #1b2128; --trait: #29313a; --trait-fort: #46515d;
  --encre: #e7ebef; --doux: #a1acb8; --faible: #7d8895; --sur-encre: #0d1115;
  --foot: #4db2c7; --nba: #e6799d;
  --ok: #63c48f; --ok-doux: #15291e; --attention: #e7a94c; --attention-doux: #2d2213;
  --stop: #f07f75; --stop-doux: #321a19; --or: #e5c25a; --or-doux: #2c2612;
  --d-tit: #8fb3dc; --d-ent: #3c5574; --d-neutre: #3a434d; --d-bande: #1f2a36;
  --v: #63c48f; --n: #a1acb8; --d: #f07f75; --sur-plein: #0d1115;
  --ombre: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .5);
}
[data-sport="nba"] { --sport: var(--nba); }

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font: 400 var(--t3)/1.45 var(--f-texte);
  font-variant-numeric: tabular-nums; overflow-x: hidden;
}
h1, h2, h3 { font-family: var(--f-titre); margin: 0; letter-spacing: -.01em; line-height: 1.2; }
h1 { font-size: var(--t5); font-weight: 800; }
h2 { font-size: var(--t4); font-weight: 700; }
h3 { font-size: var(--t3); font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.doux { color: var(--doux); }
.petit { font-size: var(--t2); }
.mini { font-size: var(--t1); }
.libelle { font-size: var(--t1); color: var(--doux); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; border-radius: var(--r1); }

/* ===== Bandeau maquette ===== */
.bandeau-maquette {
  font-size: var(--t1); color: var(--doux); background: var(--surface-2); border-bottom: 1px solid var(--trait);
  padding: 4px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px));
}
.bandeau-maquette b { color: var(--encre); font-weight: 600; }

/* ===== Boutons (une seule famille) ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  min-height: 40px; padding: 0 var(--e4); border-radius: var(--r2);
  border: 1px solid var(--trait-fort); background: var(--surface); cursor: pointer;
  font-size: var(--t2); font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.principal { background: var(--encre); color: var(--sur-encre); border-color: var(--encre); }
.btn.discret { border-color: transparent; background: transparent; }
.btn.discret:hover { background: var(--surface-2); }
.btn.rond { width: 40px; padding: 0; border-radius: var(--rp); }
.btn svg { width: 18px; height: 18px; flex: none; }
/* Un seul style actif pour tout : fond encre, texte inversé */
[aria-current="page"], [aria-pressed="true"], [aria-selected="true"] { background: var(--encre) !important; color: var(--sur-encre) !important; border-color: var(--encre) !important; }
.seg { display: inline-flex; border: 1px solid var(--trait-fort); border-radius: var(--r2); padding: 2px; gap: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; min-height: 34px; padding: 0 var(--e3); border-radius: 6px; cursor: pointer; font-size: var(--t2); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { background: var(--surface-2); }

/* ===== Étiquettes, pastilles ===== */
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: var(--r1); font-size: var(--t1); font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--doux); border: 1px solid var(--trait); }
.tag.ok { background: var(--ok-doux); color: var(--ok); border-color: transparent; }
.tag.attention { background: var(--attention-doux); color: var(--attention); border-color: transparent; }
.tag.stop { background: var(--stop-doux); color: var(--stop); border-color: transparent; }
.cap { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--r1); background: var(--encre); color: var(--sur-encre); font-size: var(--t1); font-weight: 700; flex: none; }
.etoiles { color: var(--or); font-weight: 600; white-space: nowrap; }
.pts-sport { width: 8px; height: 8px; border-radius: 50%; background: var(--sport); display: inline-block; flex: none; }
.vnd { display: inline-flex; gap: 2px; }
.vnd span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--r1); font-size: var(--t1); font-weight: 700; color: var(--sur-plein); }
.vnd .V { background: var(--v); } .vnd .N { background: var(--n); } .vnd .D { background: var(--d); }

/* ===== Cadre : barre latérale (PC), barre haute + onglets bas (téléphone) ===== */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
@media (min-width: 1024px) {
  .app { background: linear-gradient(to right, var(--surface) 239px, var(--trait) 239px, var(--trait) 240px, transparent 240px); }
  .app.rail { background: linear-gradient(to right, var(--surface) 67px, var(--trait) 67px, var(--trait) 68px, transparent 68px); }
}
.laterale { display: none; }
.haut {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--e2);
  height: 56px; background: color-mix(in srgb, var(--fond) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--trait);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.haut .espace { flex: 1; }
.btn-maj .age { font-size: var(--t1); color: var(--doux); font-weight: 600; }
.bas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--trait); padding: 4px max(8px, env(safe-area-inset-left, 0px)) calc(4px + env(safe-area-inset-bottom, 0px));
}
.bas a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: var(--r2); text-decoration: none; font-size: var(--t1); font-weight: 600; color: var(--doux); min-height: 48px; }
.bas a svg { width: 22px; height: 22px; }
main { min-width: 0; padding: var(--e4) max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }

@media (min-width: 1024px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); }
  .app.rail { grid-template-columns: 68px minmax(0, 1fr); }
  .haut, .bas { display: none; }
  main { padding: var(--e5) max(24px, env(safe-area-inset-right, 0px)) var(--e6) var(--e5); }
  .laterale {
    display: flex; flex-direction: column; gap: var(--e4); position: sticky; top: 0; height: calc(100vh - 26px); overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--trait);
    padding: var(--e4) var(--e3) var(--e3) max(12px, env(safe-area-inset-left, 0px));
  }
}
.marque { display: flex; align-items: center; gap: var(--e2); min-height: 40px; }
.marque .logo { width: 28px; height: 28px; flex: none; }
.marque b { font-family: var(--f-titre); font-size: var(--t3); font-weight: 800; flex: 1; white-space: nowrap; }
.lat-section { display: grid; gap: 4px; }
.lat-section > .libelle { padding: 0 var(--e2); margin-bottom: 2px; }
.lat-lien {
  display: flex; align-items: center; gap: var(--e3); min-height: 40px; padding: 0 var(--e2); border-radius: var(--r2);
  text-decoration: none; font-size: var(--t2); font-weight: 600; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; width: 100%;
}
.lat-lien:hover { background: var(--surface-2); }
.lat-lien svg { width: 20px; height: 20px; flex: none; }
.lat-lien .compte { margin-left: auto; font-size: var(--t1); color: inherit; opacity: .7; }
.lat-sport { min-height: 52px; align-items: center; }
.lat-sport .txt { display: grid; line-height: 1.25; min-width: 0; }
.lat-sport .txt small { font-size: var(--t1); font-weight: 400; opacity: .8; white-space: nowrap; }
.etat-palier { border: 1px solid var(--trait); border-radius: var(--r2); padding: var(--e3); display: grid; gap: var(--e2); font-size: var(--t2); background: var(--surface-2); }
.etat-palier .alerte { color: var(--attention); font-weight: 600; }
.lat-pied { margin-top: auto; display: grid; gap: var(--e2); border-top: 1px solid var(--trait); padding-top: var(--e3); }
.lat-pied .ligne-outils { display: flex; gap: 4px; align-items: center; }
.progression { height: 4px; border-radius: var(--rp); background: var(--trait); overflow: hidden; }
.progression i { display: block; height: 100%; background: var(--encre); width: 0; transition: width .3s linear; }
.app.rail .lat-masque { display: none !important; }
.app.rail .lat-lien { justify-content: center; padding: 0; }
.app.rail .marque { flex-direction: column; }
.app.rail .lat-pied .ligne-outils { flex-direction: column; }

/* ===== En-tête de page ===== */
.entete { display: flex; flex-wrap: wrap; align-items: end; gap: var(--e2) var(--e4); margin-bottom: var(--e4); }
.entete .titres { min-width: 0; flex: 1 1 260px; display: grid; gap: 2px; }
.entete .outils { display: flex; flex-wrap: wrap; gap: var(--e2); align-items: center; }

/* ===== Surfaces ===== */
.carte { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r2); min-width: 0; }
.carte > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--e2) var(--e3); padding: var(--e4) var(--e4) var(--e3); }
.carte > header .droite { margin-left: auto; }
.carte .corps { padding: 0 var(--e4) var(--e4); }
.pile { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e4); align-content: start; min-width: 0; }
.libelle.long { white-space: normal; }
.legende-dist { margin-top: var(--e2); display: grid; gap: 4px; }

/* ===== Accueil ===== */
.accueil-grille { display: grid; gap: var(--e4); }
@media (min-width: 900px) { .accueil-grille { grid-template-columns: 1fr 1fr; gap: var(--e5); } }
.panneau-sport { grid-template-columns: minmax(0, 1fr); padding: var(--e5) var(--e5) var(--e4); display: grid; gap: var(--e4); align-content: start; position: relative; overflow: hidden; }
.panneau-sport::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--sport); }
.panneau-sport .tete { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2); }
@media (max-width: 600px) { .panneau-sport { padding: var(--e4); } }
.panneau-sport .tete h2 { font-size: var(--t4); }
.panneau-sport .tete .droite { margin-left: auto; }
.hero { display: flex; align-items: baseline; gap: var(--e3); flex-wrap: wrap; }
.hero .valeur { font-family: var(--f-titre); font-size: var(--t-hero); font-weight: 800; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.hero .valeur small { font-size: var(--t6); font-weight: 700; margin-left: 2px; }
.hero .phrase { font-size: var(--t3); color: var(--doux); max-width: 26ch; }
.fragile .hero .valeur { color: var(--doux); }
.chemin { display: grid; grid-template-columns: repeat(6, 1fr); position: relative; margin: 0 0 var(--e1); }
.chemin::before { content: ""; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 11px; height: 2px; background: var(--trait-fort); }
.chemin .jalon { display: grid; justify-items: center; gap: 4px; position: relative; font-size: var(--t1); color: var(--doux); }
.chemin .jalon i { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 2px solid var(--trait-fort); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: var(--t1); }
.chemin .jalon.passe i { background: var(--encre); border-color: var(--encre); color: var(--sur-encre); }
.chemin .jalon.encours i { border-color: var(--sport); border-width: 3px; color: var(--encre); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sport) 20%, transparent); }
.chemin .jalon.encours { color: var(--encre); font-weight: 700; }
.anim .chemin .jalon.encours i { animation: pulse 1.2s ease-out .9s 1; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sport) 60%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.equipe-puces { display: flex; flex-wrap: wrap; gap: 6px; }
.equipe-puces .tag { height: 26px; font-size: var(--t2); color: var(--encre); background: var(--surface-2); }
.equipe-puces .tag b { font-weight: 600; color: var(--doux); }
.faits { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--e3); }
.fait { display: grid; gap: 2px; min-width: 0; }
.fait .v { font-size: var(--t4); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; flex-wrap: wrap; gap: var(--e2); }
.legende { font-size: var(--t1); color: var(--doux); display: flex; flex-wrap: wrap; gap: 4px var(--e3); align-items: center; }
.legende .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }

/* ===== Graphiques ===== */
.g { width: 100%; min-width: 0; }
.g svg, svg.gx { display: block; overflow: visible; }
.g text, svg.gx text { font-family: var(--f-texte); font-size: 12px; fill: var(--doux); font-variant-numeric: tabular-nums; }
.dist .b { fill: var(--d-neutre); }
.dist .b.passe { fill: var(--sport); }
.dist .zone { fill: color-mix(in srgb, var(--sport) 9%, transparent); }
.dist .cible { stroke: var(--encre); stroke-width: 2; }
.dist .axe { stroke: var(--trait-fort); }
.dist text.fort { fill: var(--encre); font-weight: 700; }
.anim .dist .b { transform-box: fill-box; transform-origin: 50% 100%; animation: monte .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 14ms); }
.anim .dist .b.passe { animation: monte .7s cubic-bezier(.2, .7, .2, 1) both, colore .6s ease both; animation-delay: calc(var(--i) * 14ms), .9s; }
.anim .dist .cible { stroke-dasharray: 200; animation: trace .6s ease .5s both; }
@keyframes monte { from { transform: scaleY(.08); } }
@keyframes colore { from { fill: var(--d-neutre); } }
@keyframes trace { from { stroke-dashoffset: 200; } }
.histo .tit { fill: var(--d-tit); }
.histo .ent { fill: var(--d-ent); stroke: var(--d-tit); stroke-width: 1.2; }
.histo .vieux { opacity: .62; }
.histo .absent { fill: none; stroke: var(--stop); stroke-dasharray: 3 3; stroke-width: 1.2; }
.histo text.abs { fill: var(--stop); font-weight: 700; }
.histo .bande { fill: var(--d-bande); }
.histo .proj { stroke: var(--encre); stroke-width: 1.5; stroke-dasharray: 5 4; }
.histo .m15 { stroke: var(--doux); stroke-width: 2; }
.histo .m3 { stroke: var(--sport); stroke-width: 3; }
.histo .grille { stroke: var(--trait); }
.histo .coupure { stroke: var(--trait-fort); stroke-width: 1.5; }
.histo text.val { fill: var(--encre); font-weight: 600; }
.barre-p .piste, .ival .piste, .cote .piste { fill: var(--trait); }
.barre-p .rempli { fill: var(--encre); }
.barre-p.bas .rempli { fill: var(--stop); }
.barre-p.confirme .rempli { fill: var(--ok); }
.barre-p .seuil { stroke: var(--attention); stroke-width: 2; }
.ival .bande { fill: color-mix(in srgb, var(--d-tit) 35%, transparent); }
.ival .pt { fill: var(--encre); stroke: var(--surface); stroke-width: 1.5; }
.cote .vic { fill: var(--encre); }
.cote .reste { fill: url(#hachure); }
.empilee { display: flex; height: 28px; border-radius: var(--r1); overflow: visible; position: relative; background: var(--surface-2); }
.empilee span { height: 100%; display: flex; align-items: center; padding: 0 6px; font-size: var(--t1); font-weight: 600; color: var(--sur-plein); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; border-right: 2px solid var(--surface); }
.empilee .marque-cible { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--encre); }
.empilee .marque-cible b { position: absolute; top: -18px; transform: translateX(-50%); font-size: var(--t1); white-space: nowrap; }
.cases16 { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; max-width: 320px; }
.cases16 i { height: 14px; border-radius: 2px; background: var(--trait); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
.cases16 i b { display: block; }
.cinq { display: flex; gap: 3px; height: 8px; max-width: 160px; }
.cinq i { flex: 1; background: var(--trait); border-radius: 2px; position: relative; overflow: hidden; }
.cinq i b { position: absolute; inset: 0 auto 0 0; background: var(--encre); }

/* ===== Chiffres clés ===== */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e3) var(--e4); }
.cq { container-type: inline-size; min-width: 0; }
@container (min-width: 600px) { .kpis { grid-template-columns: 1.2fr repeat(3, minmax(0, 1fr)); } }
.kpi { display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi .v { font-size: var(--t5); font-weight: 700; line-height: 1.1; white-space: nowrap; letter-spacing: -.01em; }
.kpi .v.long { font-size: var(--t4); white-space: normal; }
.kpi.heros .v { font-size: var(--t6); font-weight: 800; }
.kpi .s { font-size: var(--t1); color: var(--doux); }

/* ===== Solo : grilles ===== */
.solo-grille { display: grid; gap: var(--e5); align-items: start; }
@media (min-width: 1360px) { .solo-grille { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
@media (min-width: 1800px) { .solo-grille { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 460px; } }
.col-fiche { display: none; }

  },
  cinq(eq) { return `<div class="cinq" role="img" aria-label="Chances de jouer des 5 joueurs">${eq.map(j => `<i title="${esc(j.nom)} ${pct(j.chancesDeJouer)}"><b style="width:${j.chancesDeJouer * 100}%"></b></i>`).join('')}</div>`; },
  cases16(eq) {
    const demi = []; eq.forEach((j, k) => { for (let i = 0; i < j.etoiles * 2; i++) demi.push(k); });
    let h = ''; for (let c = 0; c < 16; c++) { const a = demi[c * 2], b = demi[c * 2 + 1]; h += `<i>${[a, b].map(k => `<b style="background:${k == null ? 'transparent' : `color-mix(in srgb, var(--sport) ${100 - k * 15}%, var(--surface))`}"></b>`).join('')}</i>`; }
    return `<div class="cases16" role="img" aria-label="${nb(eq.reduce((a, j) => a + j.etoiles, 0), 1)} étoiles sur 16">${h}</div>`;
  },
  empilee(eq, cap, cible) {
    const parts = eq.map(j => ({ j, v: j.esperance * (1 + j.bonus + (j.carteId === cap ? 0.5 : 0)) / (1 + j.bonus) })).sort((a, b) => b.v - a.v);
    const tot = parts.reduce((a, p) => a + p.v, 0), M = Math.max(tot, cible) * 1.04;
    return `<div class="empilee" role="img" aria-label="Contribution de chaque joueur au score attendu (${nb(tot)}) face à la cible ${cible}">${parts.map((p, i) => `<span style="width:${p.v / M * 100}%;background:color-mix(in srgb, var(--sport) ${[100, 82, 64, 46, 32][i]}%, var(--surface));color:${i < 3 ? 'var(--sur-plein)' : 'var(--encre)'}" title="${esc(p.j.nom)} : ${nb(p.v, 1)}">${esc(p.j.nom.split(' ').slice(-1)[0])} ${nb(p.v)}</span>`).join('')}<i class="marque-cible" style="left:${cible / M * 100}%"><b>cible ${cible}</b></i></div>`;
  },
  dist(w, o) {
    const h = o.h || 170, pl = 2, pr = 2, pt = 28, pb = 22, iw = w - pl - pr, ih = h - pt - pb, t = o.sim.trie, cible = o.cible;
    const pas = o.sport === 'football' ? 20 : 10;
    const lo = Math.max(0, Math.floor(Math.min(quant(t, 0.005), cible * 0.75) / pas) * pas), hi = Math.ceil(Math.max(quant(t, 0.995), cible * 1.2) / pas) * pas;
    const n = Math.max(20, Math.min(44, Math.round(iw / 13))), st = (hi - lo) / n, c = new Array(n).fill(0);
    for (const v of t) c[Math.max(0, Math.min(n - 1, Math.floor((v - lo) / st)))]++;
    const mx = Math.max(...c), bw = iw / n, X = v => pl + (v - lo) / (hi - lo) * iw, xc = X(cible);
    let s = `<svg class="dist" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Distribution simulée du score de l'équipe : ${pct(o.sim.p)} des tirages atteignent la cible ${cible}">`;
    s += `<rect class="zone" x="${xc}" y="${pt - 6}" width="${pl + iw - xc}" height="${ih + 6}"/>`;
    c.forEach((k, i) => { const hh = Math.max(1, k / mx * ih); const passe = lo + (i + 0.5) * st >= cible; s += `<rect class="b${passe ? ' passe' : ''}" style="--i:${i}" x="${(pl + i * bw + 0.75).toFixed(1)}" y="${(pt + ih - hh).toFixed(1)}" width="${Math.max(1, bw - 1.5).toFixed(1)}" height="${hh.toFixed(1)}" rx="1"/>`; });
    s += `<line class="axe" x1="${pl}" x2="${pl + iw}" y1="${pt + ih + 0.5}" y2="${pt + ih + 0.5}"/>`;
    const tick = o.sport === 'football' ? 100 : 50;
    for (let v = Math.ceil(lo / tick) * tick; v <= hi; v += tick) s += `<text x="${X(v)}" y="${h - 4}" text-anchor="middle">${v}</text>`;
    s += `<line class="cible" x1="${xc}" x2="${xc}" y1="${pt - 12}" y2="${pt + ih}"/>`;
    const gauche = xc > w * 0.35;
    s += `<text class="fort" x="${gauche ? xc - 6 : xc + 6}" y="${pt - 14}" text-anchor="${gauche ? 'end' : 'start'}">cible ${cible}</text>`;
    s += `<text class="fort" x="${pl + iw}" y="${pt - 14}" text-anchor="end" style="fill:var(--sport)">${gauche ? '' : ''}${pct(o.sim.p)} ≥ cible</text>`;
    const xm = X(o.sim.moy); s += `<path d="M${xm - 5} ${pt + ih + 9} L${xm} ${pt + ih + 3} L${xm + 5} ${pt + ih + 9}Z" style="fill:var(--encre)"><title>Moyenne simulée ${nb(o.sim.moy)}</title></path>`;
    return s + '</svg>';
  },
  histo(w, j) {
    const max = ECHELLE[j.sport], h = 200, pl = 26, pr = 6, pt = 18, pb = 34, iw = w - pl - pr, ih = h - pt - pb;
    const H = j.historique15, n = H.length, Y = v => pt + ih - Math.min(v, max) / max * ih;
    const jours = H.map(m => Date.parse(m.date) / 864e5);
    const u = [0]; const coupures = [];
    for (let i = 1; i < n; i++) { const d = jours[i] - jours[i - 1]; const g = d > 21 ? 2 : 1; if (g > 1) coupures.push(i); u.push(u[i - 1] + g); }
    const bw = Math.min(24, iw / (u[n - 1] + 1) * 0.72), k = (iw - bw) / Math.max(1, u[n - 1]), X = i => pl + bw / 2 + u[i] * k;
    const joues = H.map((m, i) => JOUE(m.situation) ? i : -1).filter(i => i >= 0), der3 = new Set(joues.slice(-3));
    const ps = j.passe.slice().sort((a, b) => a - b), q10 = quant(ps, 0.1), q90 = quant(ps, 0.9), proj = j.scoreSiJoue / (1 + j.bonus);
    let s = `<svg class="histo" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Historique des ${n} derniers matchs de ${esc(j.nom)}">`;
    for (let v = 0; v <= max; v += max / 4) s += `<line class="grille" x1="${pl}" x2="${pl + iw}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    s += `<rect class="bande" x="${pl}" y="${Y(q90)}" width="${iw}" height="${Math.max(1, Y(q10) - Y(q90))}"><title>80 % des matchs joués entre ${nb(q10)} et ${nb(q90)}</title></rect>`;
    coupures.forEach(i => { const x = (X(i) + X(i - 1)) / 2; s += `<path class="coupure" fill="none" d="M${x - 4} ${pt + ih + 4} l4 -8 M${x} ${pt + ih + 4} l4 -8"/>`; });
    let moisPrec = '';
    H.forEach((m, i) => {
      const x = X(i), titre = `${fJourMois.format(new Date(m.date))} · ${m.situation === 'entre' ? 'entré en jeu' : m.situation} · ${m.score} pts${m.minutes ? ' · ' + m.minutes + ' min' : ''}`;
      if (JOUE(m.situation)) {
        const y = Y(m.score), cls = (m.situation === 'entre' ? 'ent' : 'tit') + (der3.has(i) ? '' : ' vieux');
        s += `<rect class="${cls}" x="${(x - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, pt + ih - y).toFixed(1)}" rx="2"><title>${titre}</title></rect>`;
        if (bw >= 13) s += `<text class="val" x="${x}" y="${y - 4}" text-anchor="middle">${m.score}</text>`;
      } else {
        s += `<rect class="absent" x="${(x - bw / 2 + 0.6).toFixed(1)}" y="${pt + 0.6}" width="${(bw - 1.2).toFixed(1)}" height="${(ih - 1.2).toFixed(1)}" rx="2"><title>${titre}</title></rect><text class="abs" x="${x}" y="${pt + ih - 6}" text-anchor="middle">${m.situation === 'banc' ? 'B' : 'A'}</text>`;
      }
      const mo = fMois.format(new Date(m.date)); if (mo !== moisPrec) { s += `<text x="${x}" y="${h - 4}" text-anchor="middle">${mo}</text>`; moisPrec = mo; }
    });
    s += `<line class="proj" x1="${pl}" x2="${pl + iw}" y1="${Y(proj)}" y2="${Y(proj)}"><title>Projection s'il joue, hors bonus : ${nb(proj)}</title></line>`;
    s += `<line class="m15" x1="${pl}" x2="${pl + iw}" y1="${Y(j.formeJoueur.moyenne15)}" y2="${Y(j.formeJoueur.moyenne15)}" opacity=".55"/>`;
    if (joues.length >= 3) { const a = joues[joues.length - 3], b = joues[joues.length - 1]; s += `<line class="m3" x1="${X(a) - bw / 2 - 3}" x2="${X(b) + bw / 2 + 3}" y1="${Y(j.formeJoueur.moyenne3)}" y2="${Y(j.formeJoueur.moyenne3)}"/>`; }
    return s + '</svg>';
  },
};

const enteteTab = () => `<div class="entete-tab libelle" aria-hidden="true"><span></span><span>Joueur</span><span>Match · victoire</span><span>Club · 5 derniers</span><span>Chances de jouer</span><span>S'il joue · 10–90 %</span></div>`;

function kpisProposition(s) {

function legendeDist(s) {

function vueSolo() {
  const s = S.sport, P = D.propositions[s], p = palier(s), eq = PROP[s], cap = capId(s), alts = autresChoix(s), base = SIM[s].p;
  const autresProp = [['Prudente', P.chancesDePasser, 'affichée'], ['Équilibrée', P.equilibree && P.equilibree.chancesDePasser], ['Ambitieuse', P.ambitieuse && P.ambitieuse.chancesDePasser]];
  const groupes = eq.map(x => ({ x, l: alts.filter(a => a.remplace === x).sort((a, b) => b.p - a.p) }));
  const altHtml = groupes.filter(g => g.l.length).map(g => {
    const a = g.l[0], d = Math.round(a.p * 100) - Math.round(base * 100), cls = d > 0 ? 'mieux' : d < 0 ? 'moins' : 'pareil';
    const info = `<div class="alt-info"><span class="delta ${cls} num">${pct(base)} → ${pct(a.p)}</span>${a.c.chancesDeJouer < S.seuil ? '<span class="tag stop">sous le seuil</span>' : ''}<span class="doux mini">simulé</span><button class="btn discret" data-act="remplacer" style="margin-left:auto;min-height:32px">Remplacer</button></div>`;
    return `<div class="groupe-alt"><h3>À la place de ${esc(g.x.nom)} (${g.x.postes.join('/')}${g.x.carteId === cap ? ', capitaine' : ''})${g.l.length > 1 ? ` · + ${g.l.length - 1} autre${g.l.length > 2 ? 's' : ''}` : ''}</h3>${ligne(a.c, { alt: info })}</div>`;
  }).join('');
  const sans = groupes.filter(g => !g.l.length).map(g => g.x.nom.split(' ').slice(-1)[0]);
  const sel = S.sel[s] || (eq.find(j => j.carteId === cap) || eq[0]).carteId;
  if (innerWidth >= 1800) S.sel[s] = sel;
  return `<div class="entete"><div class="titres"><h1>Solo ${NOM[s]}</h1><p class="doux petit">Palier ${p.cible} · niveau ${p.niveau} sur ${p.sur} · ${etatTexte(s)}</p></div>
      <div class="outils reglages"><div class="seg" role="group" aria-label="Créneaux"><button aria-pressed="true">Plusieurs créneaux</button><button data-act="creneau">Créneau unique</button></div>
      <div class="seg" role="group" aria-label="Seuil de chances de jouer">${[0.7, 0.8, 0.9].map(v => `<button data-act="seuil" data-v="${v}" aria-pressed="${S.seuil === v}">${Math.round(v * 100)}${nbsp}%</button>`).join('')}</div></div></div>
    <div class="solo-grille">
      <div class="pile">
        <section class="carte" aria-label="Proposition prudente">
          <header><h2>Proposition prudente</h2><span class="doux petit">presque aussi bonne que la meilleure, avec le plus de chances que les 5 jouent</span></header>
          <div class="corps pile">
            ${kpisProposition(s)}
            <div>${graphe(w => G.dist(w, { sim: SIM[s], cible: p.cible, sport: s, h: 160 }))}${legendeDist(s)}</div>
            <div style="padding-top:20px"><span class="libelle long">Qui porte l'équipe · score attendu par joueur${cap ? ', capitaine compris' : ''}</span><div style="margin-top:22px">${G.empilee(eq, cap, p.cible)}</div></div>
          </div>
          <div class="tableau">${enteteTab()}${eq.map(j => ligne(j)).join('')}</div>
          <div class="corps" style="padding-top:var(--e4)"><div class="actions"><button class="btn principal" data-act="jouee">J'ai joué cette équipe</button><span class="doux mini" style="align-self:center">marque les 5 cartes, annulable pendant 8 s</span></div></div>
          <details class="repli"><summary>Autres propositions <span class="doux" style="font-weight:400">équilibrée ${pct(autresProp[1][1])} · ambitieuse ${autresProp[2][1] == null ? 'aucune ne fait mieux' : pct(autresProp[2][1])}</span></summary>
            <div class="corps" style="display:grid;gap:8px">${autresProp.map(([n, v, x]) => `<div style="display:grid;grid-template-columns:110px minmax(0,1fr) 52px;gap:12px;align-items:center" class="petit"><span>${n}${x ? ' <span class="doux">(ci-dessus)</span>' : ''}</span><svg class="gx" width="100%" height="10" role="img" aria-label="${n} ${pct(v)}"><rect width="100%" height="10" rx="2" style="fill:var(--trait)"/>${v != null ? `<rect width="${v * 100}%" height="10" rx="2" style="fill:var(--encre)"/>` : ''}</svg><b class="num" style="text-align:right">${v == null ? '—' : pct(v)}</b></div>`).join('')}<p class="note-sim">Maquette : le détail des deux autres équipes n'est pas dans les données d'exemple.</p></div></details>
        </section>
      </div>
      <section class="carte" aria-label="Autres choix">
        <header><h2>Autres choix</h2><span class="doux petit">meilleure carte de remplacement par joueur</span></header>
        <div class="corps"><p class="note-sim">Chances de passer recalculées par la simulation de la maquette (base ${pct(base)}), parmi les ${JOUEURS[s].length - eq.length} autres cartes de l'exemple.</p></div>
        <div class="tableau">${altHtml}</div>
        ${sans.length ? `<div class="corps" style="padding-top:var(--e3);border-top:1px solid var(--trait)"><p class="petit doux">Aucune carte de l'exemple ne remplace ${sans.join(', ')} sans casser l'équipe${s === 'nba' ? ' (16 étoiles, joueur unique)' : ' (postes, joueur unique)'}.</p></div>` : ''}
      </section>
      <aside class="col-fiche carte" aria-label="Fiche épinglée"><div class="volet-tete" style="position:sticky">${ico('epingle', ' style="width:18px;height:18px"')}<b>Fiche épinglée</b><span class="mini doux">clic sur une ligne pour changer</span></div>${innerWidth >= 1800 ? fiche(trouve(sel)) : ''}</aside>
    </div>`;
}

function blocClub(titre, nom, f, s) {
  const recents = [...f.derniers].reverse();
  const buts = s === 'football'
    ? `<div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center" class="petit"><span>${nb(f.butsPour, 1)} marqués</span><div class="divergent" role="img" aria-label="Buts par match : ${nb(f.butsPour, 1)} marqués, ${nb(f.butsContre, 1)} encaissés"><i class="pour" style="width:${Math.min(100, f.butsPour / 3 * 100)}%"></i><i class="contre" style="width:${Math.min(100, f.butsContre / 3 * 100)}%"></i></div><span>${nb(f.butsContre, 1)} encaissés</span></div>`
    : `<p class="petit">${nb(f.butsPour, 1)} points marqués, ${nb(f.butsContre, 1)} encaissés par match (écart <b>${f.butsPour - f.butsContre >= 0 ? '+' : '−'}${nb(Math.abs(f.butsPour - f.butsContre), 1)}</b>)</p>`;
  return `<div class="club-forme">
    <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="libelle">${titre}</span><b>${esc(nom)}</b></div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${G.pastilles(f.derniers)}<span class="petit"><b>${pct(f.pctVictoires10)}</b> de victoires sur 10</span>${f.serie ? `<span class="petit doux">${f.serie}</span>` : ''}</div>
    <ul class="res-liste" aria-label="Du plus récent au plus ancien">${recents.map(r => `<li><span class="vnd"><span class="${r.res}">${r.res}</span></span><span class="num">${r.score}</span><span class="adv">${r.domicile ? 'vs' : '@'} ${esc(r.adversaire)}</span></li>`).join('')}</ul>
    ${s === 'football' ? `<span class="mini doux">Buts par match sur 10</span>` : ''}${buts}
  </div>`;
}

function fiche(j) {
  if (!j) return '';
  const s = j.sport, m = j.match, cap = j.carteId === capId(s), v = m.victoirePct, fj = j.formeJoueur;
  const nbJ = j.historique15.filter(h => JOUE(h.situation)).length, nbT = j.historique15.filter(h => h.situation === 'titulaire').length;
  const tend = fj.tendance === 'hausse' ? '<span style="color:var(--ok);font-weight:600">en hausse</span>' : fj.tendance === 'baisse' ? '<span style="color:var(--stop);font-weight:600">en baisse</span>' : '<span class="doux">stable</span>';
  const leg = s === 'football'
    ? `<span><i class="sw" style="background:var(--d-tit)"></i>titulaire</span><span><i class="sw" style="background:var(--d-ent);outline:1.2px solid var(--d-tit)"></i>entré en jeu</span>`
    : `<span><i class="sw" style="background:var(--d-tit)"></i>a joué</span>`;
  return `<div class="fiche">
    <div class="fiche-tete"><img src="${j.vignette}" alt="Carte ${esc(j.nom)} ${esc(j.collection)}" width="96">
      <div style="min-width:0;display:grid;gap:4px"><h2>${esc(j.nom)}</h2>
        <p class="meta">${j.postes.join('/')} · ${esc(j.club)} · ${j.tier.replace('_PLUS', '+').toLowerCase()} · <span class="etoiles">★ ${nb(j.etoiles, 1)}</span></p>
        <p class="meta">${dateLongue(m.coupEnvoiUTC)} · ${esc(m.competition)} · ${m.lieu === 'domicile' ? 'à domicile contre' : "à l'extérieur contre"} ${esc(m.adversaire)}</p>
        <div class="tags"><span class="tag ok">${esc(j.statut)}</span>${j.bonusPct ? `<span class="tag">${esc(j.collection)} +${j.bonusPct}${nbsp}%</span>` : `<span class="tag">${esc(j.collection)}</span>`}${cap ? '<span class="tag"><span class="cap">C</span>capitaine, × 1,5</span>' : ''}</div></div></div>
    <div class="fiche-grille">
      <div class="pile">
        <div class="bloc cq"><div class="kpis">
          <div class="kpi heros"><span class="libelle">Chances de jouer</span><span class="v">${pct(j.chancesDeJouer)}</span>${G.barreP(j.chancesDeJouer, S.seuil, 140, 10)}<span class="s">repère orange : ton seuil de ${pct(S.seuil)}</span></div>
          <div class="kpi"><span class="libelle">S'il joue</span><span class="v">${nb(j.scoreSiJoue)}</span>${G.ival(j, 140, true)}<span class="s">80 % des matchs entre ${nb(j.q10)} et ${nb(j.q90)}</span></div>
          <div class="kpi"><span class="libelle">Espérance</span><span class="v">${nb(j.esperance, 1)}</span><span class="s">chances × score s'il joue, bonus compris</span></div>
          <div class="kpi"><span class="libelle">Victoire</span><span class="v">${v == null ? '—' : pct(v / 100)}</span>${v == null ? '<span class="s">cote pas encore publiée</span>' : `${G.cote(v, 140)}<span class="s">nul ou défaite ${100 - v}${nbsp}% (détail non fourni)</span>`}</div>
        </div></div>
        <div class="bloc">
          <header><h3>${j.historique15.length} derniers matchs</h3><span class="droite petit doux">joué ${nbJ} sur ${j.historique15.length}${s === 'football' ? ` · titulaire ${nbT}` : ''}</span></header>
          ${graphe(w => G.histo(w, j))}
          <p class="legende">${leg}<span><i class="sw" style="border:1.2px dashed var(--stop)"></i>B banc · A absent</span><span><i class="sw" style="background:var(--d-bande)"></i>10–90 %</span><span><i class="sw" style="height:3px;background:var(--sport)"></i>3 derniers : ${nb(fj.moyenne3)}</span><span><i class="sw" style="height:2px;background:var(--doux)"></i>15 derniers : ${nb(fj.moyenne15)}</span><span><i class="sw" style="height:0;border-top:1.5px dashed var(--encre)"></i>projection hors bonus</span></p>
          <p class="petit">Forme du joueur : ${tend} (${nb(fj.moyenne3)} sur ses 3 derniers matchs joués contre ${nb(fj.moyenne15)} sur 15). Les vides séparent les longues coupures.</p>
        </div>
      </div>
      <div class="bloc">
        <header><h3>Forme des clubs</h3><span class="droite mini doux">plus récent à droite</span></header>
        ${blocClub('Son équipe', j.club, j.formeClub, s)}
        ${blocClub('Adversaire', m.adversaire, j.formeAdversaire, s)}
      </div>
    </div>
  </div>`;
}

function vueFiche() {
  const s = S.sport, j = trouve(S.sel[s]) || PROP[s].find(x => x.carteId === capId(s)) || PROP[s][0];
  S.sel[s] = j.carteId;
  return `<div class="entete"><div class="titres"><a class="btn discret" href="${lien('solo')}" style="justify-self:start;padding-left:4px">${ico('retour')}Retour au Solo</a></div></div>
    <section class="carte" style="padding:var(--e4)" aria-label="Fiche joueur">${fiche(j)}</section>`;
}

function vueSquad() {
  return `<div class="entete"><div class="titres"><h1>Squad ${NOM[S.sport]}</h1><p class="doux petit">Meilleure équipe du jour</p></div>
    <div class="outils"><div class="seg" role="group" aria-label="Jour">${['sam. 7', 'dim. 8', 'lun. 9'].map((d, i) => `<button aria-pressed="${i === 0}">${d}</button>`).join('')}</div></div></div>
    <section class="carte"><div class="corps" style="padding-top:var(--e4)"><p>Non maquetté ici : même gabarit que le Solo (l'équipe du jour en tableau à gauche, les 10 meilleures cartes du jour à droite, la fiche épinglée à 1 920 px).</p></div></section>`;
}

const COLS = {
  nom: j => j.nom, poste: j => j.postes[0], etoiles: j => j.etoiles, coup: j => j.match.coupEnvoiUTC, p: j => j.chancesDeJouer,
  s: j => j.scoreSiJoue, e: j => j.esperance, ppe: j => j.esperance / j.etoiles, forme: j => j.formeClub.pctVictoires10, bonus: j => j.bonusPct, jouee: j => S.jouees.has(j.carteId) ? 1 : 0,
};
function cartesFiltrees() {
  const s = S.sport, q = S.q.trim().toLowerCase(), c = COLS[S.tri.cle];
  return JOUEURS[s].filter(j => (S.poste === 'tous' || j.postes.includes(S.poste)) && (!q || (j.nom + ' ' + j.club).toLowerCase().includes(q)))
    .sort((a, b) => { const x = c(a), y = c(b); return (x < y ? -1 : x > y ? 1 : 0) * S.tri.sens; });
}
function corpsCartes() {
  const s = S.sport, L = cartesFiltrees(), nba = s === 'nba';
  const th = (k, l, r = '') => `<th scope="col" class="${r}" ${S.tri.cle === k ? `aria-sort="${S.tri.sens > 0 ? 'ascending' : 'descending'}"` : ''}><button data-act="tri" data-v="${k}">${l}<span class="fl">${S.tri.cle === k ? (S.tri.sens > 0 ? '▲' : '▼') : ''}</span></button></th>`;
  const lignes = L.map(j => `<tr data-id="${j.carteId}" class="${S.sel[s] === j.carteId && S.voletOuvert ? 'choisie' : ''}">
    <td><input type="checkbox" data-act="cocher" data-v="${j.carteId}" ${S.jouees.has(j.carteId) ? 'checked' : ''} aria-label="${esc(j.nom)} jouée au palier"></td>
    <td><img src="${j.vignette}" alt="" width="26" height="42"></td>
    <td><span class="nom">${esc(j.nom)}</span><span class="sous">${esc(j.club)}</span></td>
    <td>${j.postes.join('/')}</td>
    ${nba ? `<td class="r etoiles">★${nb(j.etoiles, 1)}</td>` : ''}
    <td><span class="nom" style="font-weight:400">${dateCourte(j.match.coupEnvoiUTC)}</span><span class="sous">${j.match.lieu === 'domicile' ? 'vs' : '@'} ${esc(j.match.adversaire)}${j.match.victoirePct != null ? ` · ${j.match.victoirePct}${nbsp}% vict.` : ''}</span></td>
    <td><div class="cellule-p"><b>${pct(j.chancesDeJouer)}</b>${G.barreP(j.chancesDeJouer, S.seuil, 56)}</div></td>
    <td><div class="cellule-p"><b>${nb(j.scoreSiJoue)}</b>${G.ival(j, 64)}</div></td>
    <td class="r"><b>${nb(j.esperance, 1)}</b></td>
    ${nba ? `<td class="r">${nb(j.esperance / j.etoiles, 1)}</td>` : ''}
    <td>${G.pastilles(j.formeClub.derniers)}</td>
    <td>${j.bonusPct ? `${esc(j.collection)} +${j.bonusPct}${nbsp}%` : `<span class="doux">${esc(j.collection)}</span>`}</td>
    <td><span class="tag ok">${esc(j.statut)}</span></td></tr>`).join('');
  return {
    table: `<table class="dense"><thead><tr>${th('jouee', 'Jouée')}<th scope="col"><span class="sr">Carte</span></th>${th('nom', 'Joueur')}${th('poste', 'Poste')}${nba ? th('etoiles', '★', 'r') : ''}${th('coup', 'Match')}${th('p', 'Chances de jouer')}${th('s', "S'il joue")}${th('e', 'Espérance', 'r')}${nba ? th('ppe', 'Pts/★', 'r') : ''}${th('forme', 'Club')}${th('bonus', 'Bonus')}<th scope="col"><button tabindex="-1">Statut</button></th></tr></thead><tbody>${lignes}</tbody></table>`,
    liste: L.map(j => ligne(j)).join('') || '<p class="corps doux">Aucune carte.</p>', n: L.length,
  };
}
function vueCartes() {
  const s = S.sport, c = corpsCartes(), postes = s === 'football' ? ['GK', 'DF', 'MD', 'FW'] : ['G', 'F', 'C'];
  return `<div class="entete"><div class="titres"><h1>Mes cartes · ${NOM[s]}</h1><p class="doux petit">Aperçu : ${JOUEURS[s].length} cartes de l'exemple (le compte en a ${COMPTE[s]}). Coche les cartes déjà jouées au palier.</p></div></div>
    <div class="barre-filtres">
      <div class="seg" role="group" aria-label="Poste">${['tous', ...postes].map(p => `<button data-act="poste" data-v="${p}" aria-pressed="${S.poste === p}">${p === 'tous' ? 'Tous' : p}</button>`).join('')}</div>
      <input class="recherche" type="search" placeholder="Chercher un joueur, un club" value="${esc(S.q)}" data-act="q" aria-label="Chercher">
      <span class="petit doux" id="compte-cartes" style="margin-left:auto">${c.n} carte${c.n > 1 ? 's' : ''} · ${marquees(s)} jouée${marquees(s) > 1 ? 's' : ''} sur ${aMarquer(s)}</span>
    </div>
    <div class="cartes-pc defile-x" id="cartes-pc">${c.table}</div>
    <div class="cartes-tel carte tableau" id="cartes-tel">${c.liste}</div>`;
}
function rafraichirCartes() {
  const c = corpsCartes();
  document.getElementById('cartes-pc').innerHTML = c.table; document.getElementById('cartes-tel').innerHTML = c.liste;
  const s = S.sport; document.getElementById('compte-cartes').textContent = `${c.n} carte${c.n > 1 ? 's' : ''} · ${marquees(s)} jouée${marquees(s) > 1 ? 's' : ''} sur ${aMarquer(s)}`;
}

/* ========== Volet (fiche à droite, PC < 1 800 px) ========== */
function rendreVolet() {
  const v = document.getElementById('volet');
  if (!S.voletOuvert) { v.hidden = true; v.innerHTML = ''; return; }
  const j = trouve(S.sel[S.sport]); if (!j) { v.hidden = true; return; }
  v.hidden = false; v.dataset.sport = j.sport;
  v.innerHTML = `<div class="volet-tete"><b>${esc(j.nom)}</b><button class="btn rond discret" data-act="prec" aria-label="Joueur précédent">${ico('haut')}</button><button class="btn rond discret" data-act="suiv" aria-label="Joueur suivant">${ico('bas')}</button><button class="btn rond discret" data-act="fermer" aria-label="Fermer la fiche">${ico('fermer')}</button></div>${fiche(j)}`;
}
let origineFocus = null;
function ouvrirFiche(id) {
  S.sel[S.sport] = id;
  if (innerWidth >= 1800 && S.vue === 'solo') { S.voletOuvert = false; rendre(false); return; }
  if (innerWidth >= 1024) {
    origineFocus = document.activeElement; S.voletOuvert = true; rendreVolet(); marquerChoisie(); dessiner();
    const v = document.getElementById('volet'); v.scrollTop = 0; v.querySelector('[data-act="fermer"]').focus({ preventScroll: true }); return;
  }
  location.hash = '#fiche' + suffixe();
}
function marquerChoisie() { document.querySelectorAll('#main [data-id]').forEach(el => el.classList.toggle('choisie', S.voletOuvert && el.dataset.id === S.sel[S.sport])); }
function fermerVolet() { S.voletOuvert = false; rendreVolet(); marquerChoisie(); if (origineFocus && document.contains(origineFocus)) origineFocus.focus(); }
function voisin(d) {
  const ids = [...new Set([...document.querySelectorAll('#main [data-id]')].filter(e => e.offsetParent).map(e => e.dataset.id))];
  const i = ids.indexOf(S.sel[S.sport]); if (!ids.length) return;
  S.sel[S.sport] = ids[(i + d + ids.length) % ids.length]; rendreVolet(); marquerChoisie(); dessiner();
}

/* ========== Rendu et navigation ========== */
function lireAdresse() {
  const m = location.hash.match(/^#(accueil|solo|squad|fiche|cartes)(?:-(football|nba))?$/);
  S.vue = m ? m[1] : 'accueil'; S.sport = m && m[2] === 'nba' ? 'nba' : (m ? 'football' : S.sport);
}
function rendre(anim) {
  GR.clear(); gid = 0;
  const main = document.getElementById('main');
  main.innerHTML = { accueil: vueAccueil, solo: vueSolo, squad: vueSquad, fiche: vueFiche, cartes: vueCartes }[S.vue]();
  main.dataset.sport = S.sport;
  rendreNav(); rendreVolet();
  const anime = anim && !REDUIT.matches;
  main.classList.toggle('anim', anime);
  dessiner();
  if (anime) compteurs();
}
function compteurs() {
  document.querySelectorAll('.compteur').forEach(el => {
    const fin = +el.dataset.v, t0 = performance.now(), dur = 1100;
    const pas = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(fin * e); if (k < 1) requestAnimationFrame(pas); };
    el.textContent = '0'; requestAnimationFrame(pas);
  });
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3200); }
function lancerMaj() {
  if (S.maj && S.maj.pct < 100) return;
  S.maj = { debut: new Date(), pct: 0 }; rendreNav(); toast(`Mise à jour demandée à ${fHeure.format(S.maj.debut)} (maquette)`);
  const it = setInterval(() => { S.maj.pct = Math.min(100, S.maj.pct + 5); rendreNav(); if (S.maj.pct >= 100) { clearInterval(it); setTimeout(() => { S.maj = null; rendreNav(); }, 2500); } }, REDUIT.matches ? 40 : 150);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) {
    const a = b.dataset.act, v = b.dataset.v;
