<title>Sorar'help</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/*STYLE*/
</style>

<!-- Motif hachuré (cote : nul ou défaite) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hachure" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" style="fill:var(--trait)"></rect>
      <line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--trait-fort)" stroke-width="2"></line>
    </pattern>
  </defs>
</svg>

<div class="app" id="app">
  <!-- PC (≥ 1 024 px) : barre latérale. Sports, modes, état du palier, puis mise à jour, thème et aide en pied. -->
  <nav class="laterale" id="laterale" aria-label="Navigation principale"></nav>

  <div class="colonne">
    <!-- Téléphone : barre collante en haut (sport, mise à jour avec l'âge des données, thème, aide) -->
    <header class="haut" id="haut"></header>
    <div class="progression-haut" id="progression-haut" hidden role="status" aria-live="polite"></div>

    <main id="main" tabindex="-1">
      <div class="bandeau" id="bandeau" hidden role="status"></div>
      <div class="note-palier" id="note-palier" hidden role="status"></div>
      <p class="chargement" id="chargement">Chargement des données…</p>

      <section id="vue-accueil" class="vue" hidden aria-label="Accueil"></section>
      <section id="vue-solo" class="vue" hidden aria-label="Solo"></section>
      <section id="vue-squad" class="vue" hidden aria-label="Squad"></section>
      <section id="vue-cartes" class="vue" hidden aria-label="Mes cartes"></section>

      <p class="stockage" id="stockage"></p>
    </main>
  </div>
</div>

<!-- Téléphone : onglets en bas -->
<nav class="bas" id="bas" aria-label="Modes"></nav>

<!-- Fiche joueur : volet à droite sur PC, plein écran sur téléphone -->
<div class="voile-fiche" id="voile-fiche" hidden></div>
<aside class="volet" id="volet" hidden role="dialog" aria-modal="false" aria-label="Fiche joueur"></aside>

<!-- Fenêtres (marquage des cartes jouées, aide) -->
<div class="voile" id="voile" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="application/json" id="donnees">/*DONNEES*/null</script>
<script type="module">
/*SCRIPT*/
</script>
