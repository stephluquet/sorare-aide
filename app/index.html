<title>Sorare aide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/*STYLE*/
</style>

<div class="cadre">
  <header class="entete">
    <nav class="onglets" id="onglets" aria-label="Écrans">
      <a href="#accueil" data-vue="accueil">Accueil</a>
      <a href="#arcade" data-vue="arcade">Arcade</a>
      <a href="#squad" data-vue="squad">Squad</a>
      <a href="#cartes" data-vue="cartes">Cartes</a>
    </nav>
    <div class="seg sport-global" id="sport-global" role="group" aria-label="Sport"></div>
  </header>
  <div class="sous" id="age">Chargement des données…</div>
  <div class="bandeau" id="bandeau" hidden></div>
  <div class="note-palier" id="note-palier" hidden></div>

  <!-- Accueil -->
  <section id="vue-accueil" class="vue" hidden>
    <h1>Mes paliers</h1>
    <div class="blocs" id="blocs"></div>
  </section>

  <!-- Propositions -->
  <section id="vue-propositions" class="vue" hidden>
    <h1 id="titre-propositions">Arcade</h1>
    <div id="alerte-arcade"></div>
    <div class="sous" id="contexte-propositions"></div>
    <div class="rangee">
      <div class="seg" id="modes" role="group" aria-label="Mode">
        <button type="button" data-mode="plusieurs" aria-pressed="true">Plusieurs créneaux</button>
        <button type="button" data-mode="unique" aria-pressed="false">Créneau unique</button>
      </div>
      <label class="reglage" for="seuil-arcade">Chances de jouer d'au moins
        <select id="seuil-arcade" class="choix-seuil">
          <option value="0.7">70 %</option>
          <option value="0.8">80 %</option>
          <option value="0.9">90 %</option>
        </select>
      </label>
    </div>
    <div id="propositions"></div>
  </section>

  <!-- Squad du jour -->
  <section id="vue-squad" class="vue" hidden>
    <h1>Squad du jour</h1>
    <div class="sous">La meilleure équipe du jour au sens du score attendu. Les cartes jouées en Arcade restent utilisables.</div>
    <div class="rangee">
      <select id="squad-jour" aria-label="Jour"></select>
    </div>
    <div id="squad"></div>
  </section>

  <!-- Mes cartes -->
  <section id="vue-cartes" class="vue" hidden>
    <h1 id="titre-cartes">Mes cartes</h1>
    <div id="alerte-cartes"></div>
    <div class="commandes">
      <div class="rangee">
        <div class="rangee" id="postes" role="group" aria-label="Poste"></div>
        <span class="compte" id="compte"></span>
      </div>
      <div class="rangee" id="filtre-etoiles" role="group" aria-label="Étoiles" hidden></div>
      <details class="filtres">
        <summary id="resume-filtres">Filtres</summary>
        <div class="rangee">
          <select id="creneau" aria-label="Journée Sorare"></select>
          <select id="tri" aria-label="Trier par"></select>
        </div>
        <div class="rangee">
          <label class="reglage" for="seuil">Chances de jouer d'au moins
            <select id="seuil" class="choix-seuil">
              <option value="0.7">70 %</option>
              <option value="0.8">80 %</option>
              <option value="0.9">90 %</option>
            </select>
          </label>
          <label class="case"><input type="checkbox" id="dispo" checked> disponibles seulement</label>
        </div>
      </details>
    </div>
    <div class="liste" id="liste"></div>
  </section>

  <div class="stockage" id="stockage"></div>
</div>
<div class="voile" id="voile" hidden></div>

<script type="application/json" id="donnees">/*DONNEES*/null</script>
<script type="module">
/*SCRIPT*/
</script>
